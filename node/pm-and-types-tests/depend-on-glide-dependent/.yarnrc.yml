nodeLinker: node-modules

npmRegistryServer: "https://registry.yarnpkg.com"

# npmMinimalAgeGate unit is minutes; 10080 = 7 days (7 * 24 * 60).
# The semgrep rule expects the "Nd" string format but yarn 4.10.3 uses
# parseInt(), so "7d" would resolve to 7 minutes at runtime.
npmMinimalAgeGate: 10080 # nosemgrep: package_managers.yarn.yarn-missing-minimal-age-gate.yarn-missing-minimal-age-gate
