nodeLinker: node-modules

npmRegistryServer: "https://registry.yarnpkg.com"

# Note: semgrep rule yarn-missing-minimal-age-gate requires the "Nd" string
# format. In yarn 4.10.3 this is parsed via parseInt(), so "7d" = 7 minutes
# at runtime; a future yarn release is expected to add proper duration parsing.
npmMinimalAgeGate: "7d"
