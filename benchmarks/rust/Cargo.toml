[package]
name = "rust-benchmark"
version = "0.1.0"
edition = "2024"
license = "Apache 2.0"
authors = ["Valkey GLIDE Maintainers"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

# GLIDE dependencies
glide-logger = { path = "../../glide-logger" }
glide-core-engine = { path = "../../glide-core/redis-rs/redis", features = ["aio"] }

# TODO #6905: Update once renamed.
glide-core = { path = "../../glide-core" }

# External dependencies
average = "0.17"
chrono = "0.4.26"
clap = { version = "4.3.8", features = ["derive"] }
futures = "0.3.28"
itoa = "1.0.6"
rand = "0.8.5"
serde_json = "1.0.99"
tikv-jemallocator = "0.7.0"
tokio = { version = "1", features = ["macros", "time", "rt-multi-thread"] }

[profile.release]
debug = true
lto = true
