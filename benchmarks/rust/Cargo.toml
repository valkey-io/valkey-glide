[package]
name = "rust-benchmark"
version = "0.0.0"
authors = ["Valkey GLIDE Maintainers"]
license = "Apache-2.0"

# TODO #7175: Specify rust-version
edition = "2024"

[dependencies]

# GLIDE dependencies
glide-logger = { path = "../../glide-logger" }
glide-core-engine = { path = "../../glide-core/redis-rs/redis", features = ["aio"] }
glide-core = { path = "../../glide-core" }

# External dependencies
average = "0.17"
chrono = "0.4.26"
clap = { version = "4.3.8", features = ["derive"] }
futures = "0.3.28"
itoa = "1.0.6"
rand = "0.8.5"
serde_json = "1.0.99"
tikv-jemallocator = "0.7.0"
tokio = { version = "1", features = ["macros", "time", "rt-multi-thread"] }

[profile.release]
debug = true
lto = true
