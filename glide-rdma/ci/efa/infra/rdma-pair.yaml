AWSTemplateFormatVersion: "2010-09-09"
Description: >
  RDMA test pair for valkey-glide: two EFA-attached Graviton hosts
  (rdma-server, rdma-client) in a cluster placement group, reachable only
  through SSM. Deleting the stack removes everything it created.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >
      Subnet in an AZ that offers the instance type. The SSM agent needs
      outbound internet, so the subnet must either assign public IPs or route
      to a NAT gateway. EFA instance capacity varies by zone.
  AssignPublicIp:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      false for a private subnet behind a NAT gateway, or an account whose
      policy denies public IPs. The hosts' security group admits nothing from
      outside either way.
  InstanceType:
    Type: String
    Default: c8gn.16xlarge
    AllowedValues: [c8gn.16xlarge, c8gn.48xlarge]
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  RootVolumeGiB:
    Type: Number
    Default: 300
  Owner:
    Type: String
    MinLength: 1
  EfaInstallerVersion:
    Type: String
    Description: aws-efa-installer release. glide-rdma needs the libfabric it ships to be 2.4 or newer.
    Default: 1.51.0
  MaxHostLifetimeMinutes:
    Type: Number
    Default: 240
    MinValue: 30
    Description: >
      Each host self-terminates this many minutes after boot, so a run whose
      teardown never fires (hard job cancellation, runner loss) cannot bill the
      instances indefinitely. The stack shell is reclaimed separately by the
      scheduled rdma-ci-* sweep. Must stay above the CreationPolicy ResourceSignal
      window (PT20M) plus bootstrap, or the host terminates before it signals and
      the stack create fails; set it well above a normal run (~20 min) plus a
      keep_hosts diagnosis window.

Resources:
  PlacementGroup:
    Type: AWS::EC2::PlacementGroup
    Properties:
      Strategy: cluster
      Tags:
        - { Key: Owner, Value: !Ref Owner }

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDMA test pair - EFA traffic between members only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0, Description: SSM agent and package installs }
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-sg" }
        - { Key: Owner, Value: !Ref Owner }

  # EFA requires all traffic allowed in and out between members of the group.
  # Separate resources because a group cannot reference itself inline. SelfEgress
  # is subsumed by the open 0.0.0.0/0 egress above today; it is kept so member
  # traffic still works if that open egress is ever tightened.
  SelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: "-1"
      SourceSecurityGroupId: !Ref SecurityGroup
  SelfEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: "-1"
      DestinationSecurityGroupId: !Ref SecurityGroup

  # The path lets a caller's IAM grant cover exactly the roles this stack
  # creates (role/rdma-ci/*) and nothing else in the account.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /rdma-ci/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: cfn-signal
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cloudformation:SignalResource
                Resource: !Ref AWS::StackId
      Tags:
        - { Key: Owner, Value: !Ref Owner }
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /rdma-ci/
      Roles: [!Ref InstanceRole]

  # EFA is only settable through a launch template: AWS::EC2::Instance's
  # NetworkInterfaces property has no InterfaceType.
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    DependsOn: [SelfIngress, SelfEgress]
    Properties:
      LaunchTemplateData:
        ImageId: !Ref ImageId
        InstanceType: !Ref InstanceType
        # A self-scheduled shutdown (see UserData) must terminate, not stop, so a
        # stranded host bills nothing and its ENI/EBS (DeleteOnTermination) go too.
        InstanceInitiatedShutdownBehavior: terminate
        Placement: { GroupName: !Ref PlacementGroup }
        IamInstanceProfile: { Arn: !GetAtt InstanceProfile.Arn }
        NetworkInterfaces:
          - DeviceIndex: 0
            InterfaceType: efa
            SubnetId: !Ref SubnetId
            Groups: [!Ref SecurityGroup]
            AssociatePublicIpAddress: !Ref AssignPublicIp
            DeleteOnTermination: true
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeSize: !Ref RootVolumeGiB, VolumeType: gp3, DeleteOnTermination: true }
        # InstanceMetadataTags lets the shared bootstrap script learn which
        # logical resource it is signalling for.
        MetadataOptions: { HttpTokens: required, HttpEndpoint: enabled, InstanceMetadataTags: enabled }
        TagSpecifications:
          - ResourceType: instance
            Tags:
              # TerminateInstances on the CI role is scoped to Project=rdma-ci.
              # Applied here so every instance carries it from the RunInstances
              # call, before any later CreateTags, making the terminate condition
              # hold even during a failed-create rollback.
              - { Key: Project, Value: rdma-ci }
          - ResourceType: volume
            Tags:
              - { Key: Owner, Value: !Ref Owner }
              - { Key: Purpose, Value: rdma-test }
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            # Installs the EFA stack and signals CloudFormation. The stack only
            # reaches CREATE_COMPLETE once both hosts have a working EFA device
            # and a libfabric glide-rdma accepts.
            set -uo pipefail
            exec > >(tee -a /var/log/rdma-bootstrap.log) 2>&1

            STACK='${AWS::StackName}'
            REGION='${AWS::Region}'
            EFA_VERSION='${EfaInstallerVersion}'
            EFA_KEY_FINGERPRINT=4E9091BCBB97A96B26B15E59A05480B1DD2D3CCC
            MIN_LIBFABRIC=2.4.0

            # Arm the self-terminate first, before the long EFA install, so a host
            # that hangs mid-bootstrap still goes away. InstanceInitiatedShutdown
            # is 'terminate', so this scheduled halt terminates the instance.
            # shutdown returns at once after scheduling; the install continues.
            shutdown -h +${MaxHostLifetimeMinutes} 'rdma-pair max lifetime reached'

            token=$(curl -sS -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 600')
            imds() { curl -sS -f -H "X-aws-ec2-metadata-token: $token" "http://169.254.169.254/latest/meta-data/$1"; }
            # CloudFormation applies instance tags shortly after launch; wait for ours.
            for _ in $(seq 60); do
              RESOURCE=$(imds tags/instance/CfnLogicalId) && break
              sleep 2
            done
            [ -n "${!RESOURCE:-}" ] || { echo "CfnLogicalId tag never appeared"; exit 1; }

            signal() {
              /opt/aws/bin/cfn-signal --exit-code "$1" --reason "$2" --stack "$STACK" --resource "$RESOURCE" --region "$REGION"
              exit "$1"
            }
            fail() { echo "FAIL: $1"; signal 1 "$1"; }

            dnf install -y aws-cfn-bootstrap || exit 1

            # RDMA registration pins memory. The installer raises the memlock
            # limit for login sessions only; processes the SSM agent starts
            # inherit systemd's default instead.
            mkdir -p /etc/systemd/system.conf.d
            printf '[Manager]\nDefaultLimitMEMLOCK=infinity\n' > /etc/systemd/system.conf.d/memlock.conf
            systemctl daemon-reexec
            systemctl restart amazon-ssm-agent

            cd /tmp || fail "cd /tmp"
            base="https://efa-installer.amazonaws.com"
            tarball="aws-efa-installer-$EFA_VERSION.tar.gz"
            curl -fsSLO "$base/$tarball" || fail "download $tarball"
            curl -fsSLO "$base/$tarball.sig" || fail "download $tarball.sig"
            curl -fsSL "$base/aws-efa-installer.key" -o aws-efa-installer.key || fail "download signing key"
            # The AMI's gnupg2-minimal has neither gpg-agent nor gpgv; the full
            # package makes a plain gpg import and verify work.
            dnf swap -y -q gnupg2-minimal gnupg2 || fail "dnf swap gnupg2-minimal gnupg2"
            export GNUPGHOME=/tmp/efa-gnupg; mkdir -m 700 -p "$GNUPGHOME"
            gpg --batch --import aws-efa-installer.key || fail "import signing key"
            fprs=$(gpg --batch --with-colons --fingerprint) || fail "gpg --fingerprint"
            grep -q "^fpr:*$EFA_KEY_FINGERPRINT:" <<<"$fprs" || fail "signing key fingerprint mismatch"
            gpg --batch --verify "$tarball.sig" "$tarball" || fail "tarball signature"
            tar xzf "$tarball" || fail "extract $tarball"
            (cd aws-efa-installer && ./efa_installer.sh -y) || fail "efa_installer.sh"
            rm -rf aws-efa-installer "$tarball" "$tarball.sig"

            modprobe efa || true
            /opt/amazon/efa/bin/fi_info -p efa -t FI_EP_RDM || fail "fi_info found no EFA device"
            libfabric=$(/opt/amazon/efa/bin/fi_info --version | awk '/^libfabric:/ {print $2}')
            printf '%s\n%s\n' "$MIN_LIBFABRIC" "${!libfabric%%amzn*}" | sort -V -C \
              || fail "libfabric $libfabric is older than $MIN_LIBFABRIC"
            echo "EFA ready: libfabric $libfabric"
            signal 0 "EFA ready, libfabric $libfabric"

  # 20 minutes covers the download plus the DKMS build of the EFA kernel module.
  ServerInstance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal: { Count: 1, Timeout: PT20M }
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        - { Key: Name, Value: rdma-server }
        - { Key: CfnLogicalId, Value: ServerInstance }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Purpose, Value: rdma-test }
        - { Key: Project, Value: rdma-ci }

  ClientInstance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal: { Count: 1, Timeout: PT20M }
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        - { Key: Name, Value: rdma-client }
        - { Key: CfnLogicalId, Value: ClientInstance }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Purpose, Value: rdma-test }
        - { Key: Project, Value: rdma-ci }

Outputs:
  ServerInstanceId: { Value: !Ref ServerInstance }
  ServerPrivateIp: { Value: !GetAtt ServerInstance.PrivateIp }
  ClientInstanceId: { Value: !Ref ClientInstance }
  ClientPrivateIp: { Value: !GetAtt ClientInstance.PrivateIp }
  SecurityGroupId: { Value: !Ref SecurityGroup }
