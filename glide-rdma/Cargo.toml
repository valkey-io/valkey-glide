[package]
name = "glide-rdma"
version = "0.1.0"

# About
description = "RDMA support for Valkey GLIDE. This crate isn't intended to be used directly."
authors = ["Valkey GLIDE Maintainers"]
license = "Apache-2.0"

# References
homepage = "https://valkey.io/valkey-glide/"
repository = "https://github.com/valkey-io/valkey-glide"

# Build
# TODO #7175: Specify rust-version
edition = "2024"

[features]
default = []
libfabric = ["dep:glide-libfabric-sys", "dep:libc", "dep:tokio", "dep:glide-logger"]

[dependencies]

# GLIDE dependencies
# Vendored from ofiwg/libfabric rev 6953579a5035, so that GLIDE owns the build
# script where there was a hard link to libfabric.
glide-libfabric-sys = { path = "glide-libfabric-sys", version = "0.1", optional = true }
# Unexpected completion-queue failures and parked memory.
glide-logger = { path = "../glide-logger", version = "0.1", optional = true }

# External dependencies
crc-fast = { version = "1.10", default-features = false, features = ["std"] }
thiserror = "2"
# For dlopen/dlsym, used to resolve libfabric at run time.
libc = { version = "0.2", optional = true }
# Only for `watch`, which wakes a transfer waiting on its region being revoked.
tokio = { version = "1", default-features = false, features = ["sync"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }

[lints.clippy]
# Prevent blocking the async runtime
await_holding_lock = "deny"
# Additional async safety lints
mutex_atomic = "warn"
