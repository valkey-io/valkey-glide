[package]
name = "glide-rs"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Valkey GLIDE Maintainers"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib"]

[dependencies]

# GLIDE dependencies
glide-logger = { path = "../glide-logger" }

# TODO #6905: Update once renamed.
redis = { path = "../glide-core/redis-rs/redis", features = ["aio", "tokio-comp", "connection-manager", "tokio-rustls-comp"] }
glide-core = { path = "../glide-core", features = [ "proto"] }
telemetrylib = { path = "../glide-core/telemetry"}

# External dependencies
anyhow = "1.0"
bytes = { version = "1.6.0" }
dashmap = "~6.2.1"
jni = "0.21.1"
log = "0.4.30"
parking_lot = "0.12"
protobuf = "3.7"
scopeguard = "1.2"
serde = "1.0.225"
serde_json = "1.0.149"
tokio = { version = "^1", features = ["rt", "macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3.16"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
