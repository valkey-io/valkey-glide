[package]
name = "glide-ffi"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Valkey GLIDE Maintainers"]

[features]
default = ["pool-support"]
pool-support = []

[lib]
crate-type = ["staticlib", "rlib", "cdylib"]

[dependencies]

# GLIDE dependencies
glide-logger = { path = "../glide-logger" }
glide-core-engine = { path = "../glide-core/redis-rs/redis", features = ["aio", "tokio-comp", "tokio-rustls-comp"] }
glide-core = { path = "../glide-core", features = ["proto"] }

# External dependencies
bytes = "1"
dashmap = "~6.2.1"
libc = "0.2"
percent-encoding = "2"
protobuf = { version = "3", features = [] }
serde_json = "1.0"
tokio = { version = "^1", features = ["rt", "macros", "rt-multi-thread", "time"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "fast-rng"] }

[dev-dependencies]
rstest = "^0.27"
serial_test = "4"
lazy_static = "1"

[profile.release]
opt-level = 3         # Optimize for performance
lto = "fat"           # Enable the most aggressive Link Time Optimization
codegen-units = 1     # Reduce the number of code generation units, increasing optimization time but improving performance
strip = "symbols"
panic = "abort"       # Code size optimization and prevent unwinding across FFI boundaries
