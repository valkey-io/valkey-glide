[package]
name = "miri-tests"
version = "0.1.0"
edition = "2024"

[dependencies]

# Mock crates that can be used as drop-in replacements for the real crates
tokio = { path = "./mock-tokio", package = "mock-tokio" }
glide-logger = { path = "./mock-glide-logger", package = "mock-glide-logger" }

# TODO #6905: Update remaining GLIDE dependencies once renamed.
redis = { path = "./mock-redis", package = "mock-redis" }
glide-core = { path = "./mock-glide-core",  package = "mock-glide-core" }

# External dependencies
bytes = "1"
libc = "0.2"
percent-encoding = "2"
protobuf = { version = "3", features = [] }
serde_json = "1.0"
url = "2"
uuid = { version = "1", features = ["v4", "fast-rng"] }

[lib]
path = "../src/lib.rs"

[features]
pool-support = []
