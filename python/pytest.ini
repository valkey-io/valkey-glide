[pytest]
markers =
    smoke_test: mark a test as a build verification testing.
    skip_if_version_below: parametrized mark for fast skipping tests by server version.
    skip_if_mock_pubsub: skip test when running with mock pubsub (requires real server connections)
    requires_search_1_3: skip test (with an attributed reason) when the connected search module is present but pre-1.3, per the INKEYS capability probe.
addopts = -k "not server_modules and not pubsub" --timeout=300
