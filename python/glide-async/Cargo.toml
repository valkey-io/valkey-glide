[package]
name = "valkey-glide"
edition = "2024"
license = "Apache-2.0"
authors = ["Valkey GLIDE Maintainers"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "glide"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]

# GLIDE dependencies
glide-logger = { path = "../../glide-logger" }
glide-core-engine = { path = "../../glide-core/redis-rs/redis", features = ["aio", "tokio-comp", "connection-manager", "tokio-rustls-comp"] }
glide-core = { path = "../../glide-core", features = ["socket-layer"] }

# External dependencies
bytes = { version = "^1.8" }
pyo3 = { version = "^0.29", features = ["extension-module", "num-bigint"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
strip = "symbols"

[features]
mock-pubsub = ["glide-core/mock-pubsub"]
