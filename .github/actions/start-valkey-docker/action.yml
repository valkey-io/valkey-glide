name: Start Valkey Servers via Docker
description: >
    Start standalone and cluster Valkey servers with modules (Search, JSON,
    Bloom, LDAP) using Docker containers on dedicated ports. These run
    alongside the source-built servers (on default ports) used by regular
    tests. Module-specific tests read the env vars written here to connect.
    Assumes valkey-cli is already on the host (installed by install-engine).

inputs:
    engine-version:
        description: >
            Valkey engine version (e.g. 9.1).
        required: true
    cluster-port-start:
        description: >
            Starting port for the 6-node cluster (uses 6 consecutive ports).
            Default is 8001, resulting in ports 8001-8006.
        required: false
        default: "8001"
    image:
        description: >
            Override the Docker image tag. Leave unset in CI: the default
            below is pinned deliberately (see the comment on it) and must
            only change via a reviewed PR. Intended for local reproduction
            of this job against a different module version
            (utils/run-modules-ci-locally.sh), not for CI itself.
        required: false
        default: ""

runs:
    using: composite
    steps:
        - name: Determine Docker image
          id: docker-image
          shell: bash
          env:
              IMAGE_OVERRIDE: ${{ inputs.image }}
          run: |
              # Pinned to a specific patch tag (ships ValkeyJSON 1.0.3) instead of
              # the floating ":9.1" tag, so a future bundle rebuild cannot silently
              # change module behavior and break unrelated PRs. Bump deliberately in
              # a reviewed PR when adopting a newer module. See GHSA-q7rf-74qm-hr9g.
              DEFAULT_IMAGE="valkey/valkey-bundle:9.1.3"
              IMAGE="${IMAGE_OVERRIDE:-$DEFAULT_IMAGE}"
              echo "image=$IMAGE" >> $GITHUB_OUTPUT
              echo "Using Docker image: $IMAGE"

        - name: Start module servers via Docker
          shell: bash
          env:
              IMAGE: ${{ steps.docker-image.outputs.image }}
              ENGINE_VERSION: ${{ inputs.engine-version }}
              CLUSTER_PORT_START: ${{ inputs.cluster-port-start }}
          run: |
              "${GITHUB_ACTION_PATH}/../../../utils/start-valkey-docker-modules.sh"
