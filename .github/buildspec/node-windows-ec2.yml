version: 0.2

# node-windows-ec2.yml
# AWS CodeBuild buildspec - EC2-orchestrated Windows CI
#
# Architecture:
#   CodeBuild (Linux, cheap) acts as orchestrator only:
#     1. Launches a Linux EC2 (Valkey AMI) and starts valkey-server via cluster_manager.py
#     2. Launches a Windows EC2 (build AMI) with user-data that:
#          - clones the repo at GITHUB_SHA
#          - builds the native node module
#          - runs npm test against the Linux EC2 Valkey endpoints
#          - uploads test-report.html + status.json to S3
#          - terminates itself
#     3. Polls S3 for status.json (completion signal)
#     4. Downloads test-report.html from S3
#     5. Tears down the Linux EC2
#
# Required environment variables (set in CodeBuild project):
#   EC2_WINDOWS_AMI_ID     - Windows Server 2022 AMI with Node/Rust/MSVC pre-installed
#   EC2_LINUX_AMI_ID       - Amazon Linux 2023 AMI with Valkey pre-installed
#   EC2_SUBNET_ID          - Subnet ID (same VPC as CodeBuild)
#   EC2_SECURITY_GROUP     - Security group ID
#   EC2_INSTANCE_PROFILE   - IAM instance profile for Linux EC2 (SSM access)
#   EC2_WINDOWS_INSTANCE_PROFILE - IAM instance profile for Windows EC2 (S3 write + SSM)
#   EC2_WINDOWS_INSTANCE_TYPE    - Windows instance type (default: c5.2xlarge)
#   EC2_LINUX_INSTANCE_TYPE      - Linux instance type (default: t3.small)
#   REPORT_BUCKET          - S3 bucket for test reports (e.g. valkey-glide-win)
#   AWS_REGION             - AWS region (default: us-east-1)
#   NODE_VERSION           - Node.js version (e.g. 20.18.0)

env:
    variables:
        AWS_REGION: "us-east-1"
        NODE_VERSION: "20.18.0"
        EC2_WINDOWS_INSTANCE_TYPE: "c5.2xlarge"
        EC2_LINUX_INSTANCE_TYPE: "t3.small"

phases:
    install:
        commands:
            - |
                Write-Host "=== Installing Python boto3 for EC2 orchestration ==="
                python -m pip install --quiet boto3
                Write-Host "boto3 installed."

            # Write all Python helper scripts from base64. Scripts receive runtime
            # values via environment variables prefixed with _GLIDE_ to avoid
            # conflicts with CodeBuild's own env vars.
            - |
                function Write-PyScript($name, $b64) {
                    $bytes = [System.Convert]::FromBase64String($b64)
                    [System.IO.File]::WriteAllBytes("$env:TEMP\$name.py", $bytes)
                    Write-Host "Wrote $name.py"
                }
                Write-PyScript "launch_linux" ""
                Write-PyScript "get_linux_ip" ""
                Write-PyScript "wait_ssm" ""
                Write-PyScript "copy_cluster_mgr" ""
                Write-PyScript "start_standalone" ""
                Write-PyScript "start_cluster" ""
                Write-PyScript "get_standalone_ep" ""
                Write-PyScript "get_cluster_ep" ""
                Write-PyScript "launch_windows" ""
                Write-PyScript "poll_s3" ""
                Write-PyScript "download_report" ""
                Write-PyScript "teardown_linux" ""
                Write-Host "All Python helper scripts written to $env:TEMP"

    build:
        commands:
            - |
                $region = $env:AWS_REGION
                $reportBucket = $env:REPORT_BUCKET
                $buildId = $env:CODEBUILD_BUILD_ID -replace ':', '-'
                $commitSha = $env:CODEBUILD_RESOLVED_SOURCE_VERSION
                $repoUrl = "https://github.com/valkey-io/valkey-glide.git"
                $env:_REGION = $region
                $env:_BUILD_ID = $buildId

                Write-Host "=== Launching Linux EC2 (Valkey server) ==="
                $linuxInstanceId = (python "$env:TEMP\launch_linux.py").Trim()
                Write-Host "Linux instance launched: $linuxInstanceId"

                $env:_LINUX_INSTANCE_ID = $linuxInstanceId
                $linuxPrivateIp = (python "$env:TEMP\get_linux_ip.py").Trim()
                Write-Host "Linux EC2: $linuxInstanceId ($linuxPrivateIp)"

                python "$env:TEMP\wait_ssm.py"
                python "$env:TEMP\copy_cluster_mgr.py"

                $env:_LINUX_PRIVATE_IP = $linuxPrivateIp
                $standaloneCmdId = (python "$env:TEMP\start_standalone.py").Trim()
                $clusterCmdId = (python "$env:TEMP\start_cluster.py").Trim()

                $env:_STANDALONE_CMD_ID = $standaloneCmdId
                $standaloneEndpoint = (python "$env:TEMP\get_standalone_ep.py").Trim()
                $env:_CLUSTER_CMD_ID = $clusterCmdId
                $clusterEndpoint = (python "$env:TEMP\get_cluster_ep.py").Trim()

                Write-Host "Standalone endpoint: $standaloneEndpoint"
                Write-Host "Cluster endpoint: $clusterEndpoint"
                Write-Host "=== Launching Windows EC2 (build + test) ==="

            # Build the Windows user-data script by assembling individual lines so no
            # unindented content appears directly in this YAML block scalar.
            - |
                $udFile = "$env:TEMP\userdata-$env:_BUILD_ID.ps1"
                $lines = [System.Collections.Generic.List[string]]::new()
                $lines.Add('<powershell>')
                $lines.Add('$ErrorActionPreference = ''Stop''')
                $lines.Add('$buildId = ''' + $env:_BUILD_ID + '''')
                $lines.Add('$commitSha = ''' + $env:CODEBUILD_RESOLVED_SOURCE_VERSION + '''')
                $lines.Add('$reportBucket = ''' + $env:REPORT_BUCKET + '''')
                $lines.Add('$region = ''' + $env:_REGION + '''')
                $lines.Add('$standaloneEndpoint = ''' + $standaloneEndpoint + '''')
                $lines.Add('$clusterEndpoint = ''' + $clusterEndpoint + '''')
                $lines.Add('$nodeVersion = ''' + $env:NODE_VERSION + '''')
                $lines.Add('$exitCode = 1')
                $lines.Add('try {')
                $lines.Add('    $env:CARGO_HOME = ''C:\cargo''')
                $lines.Add('    $env:RUSTUP_HOME = ''C:\rustup''')
                $lines.Add('    $env:RUSTUP_TOOLCHAIN = ''stable''')
                $lines.Add('    $env:PATH = "C:\cargo\bin;C:\Windows\System32;C:\Program Files\nodejs;$env:PATH"')
                $lines.Add('    $env:PROTOC = ''C:\Windows\System32\protoc.exe''')
                $lines.Add('    Write-Host ''=== Updating Rust ===''')
                $lines.Add('    & ''C:\cargo\bin\rustup.exe'' update stable 2>&1')
                $lines.Add('    Write-Host "Cargo: $(& ''C:\cargo\bin\cargo.exe'' --version)"')
                $lines.Add('    $vsWhere = ''C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe''')
                $lines.Add('    if (Test-Path $vsWhere) {')
                $lines.Add('        $vsPath = & $vsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>$null')
                $lines.Add('        if ($vsPath) {')
                $lines.Add('            $vcVer = (Get-Content "$vsPath\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()')
                $lines.Add('            $env:PATH = "$vsPath\VC\Tools\MSVC\$vcVer\bin\Hostx64\x64;$env:PATH"')
                $lines.Add('        }')
                $lines.Add('    }')
                $lines.Add('    Write-Host ''=== Cloning repo ===''')
                $lines.Add('    git clone https://github.com/valkey-io/valkey-glide.git C:\build\valkey-glide --depth=1')
                $lines.Add('    Set-Location C:\build\valkey-glide')
                $lines.Add('    git fetch origin $commitSha')
                $lines.Add('    git checkout $commitSha')
                $lines.Add('    Write-Host ''=== Building ===''')
                $lines.Add('    Set-Location utils; npm ci; npm run build; Set-Location ..')
                $lines.Add('    Set-Location node; npm ci; npm run build:release')
                $lines.Add('    Write-Host ''=== Running tests ===''')
                $lines.Add('    $testArgs = @(''test'', ''--'', ''--runInBand'', ''--forceExit'')')
                $lines.Add('    if ($standaloneEndpoint) { $testArgs += "--standalone-endpoints=$standaloneEndpoint" }')
                $lines.Add('    if ($clusterEndpoint) { $testArgs += "--cluster-endpoints=$clusterEndpoint" }')
                $lines.Add('    $testArgs += ''--testPathIgnorePatterns=ServerModules''')
                $lines.Add('    $testArgs += ''--testPathIgnorePatterns=TlsTest''')
                $lines.Add('    $testArgs += ''--testPathIgnorePatterns=MutualTLS''')
                $lines.Add('    & npm @testArgs')
                $lines.Add('    $exitCode = $LASTEXITCODE')
                $lines.Add('} catch {')
                $lines.Add('    Write-Host "Build/test failed: $_"')
                $lines.Add('    $exitCode = 1')
                $lines.Add('} finally {')
                $lines.Add('    try {')
                $lines.Add('        if (Test-Path ''C:\build\valkey-glide\node\test-report.html'') {')
                $lines.Add('            & ''C:\Program Files\Amazon\AWSCLIV2\aws.exe'' s3 cp ''C:\build\valkey-glide\node\test-report.html'' "s3://$reportBucket/$buildId/test-report.html" --region $region')
                $lines.Add('        }')
                $lines.Add('        $status = if ($exitCode -eq 0) { ''success'' } else { ''failed'' }')
                $lines.Add('        $json = ''{"status":"'' + $status + ''","exitCode":'' + $exitCode + ''}''')
                $lines.Add('        $json | Out-File -FilePath ''C:\status.json'' -Encoding UTF8')
                $lines.Add('        & ''C:\Program Files\Amazon\AWSCLIV2\aws.exe'' s3 cp ''C:\status.json'' "s3://$reportBucket/$buildId/status.json" --region $region')
                $lines.Add('    } catch { Write-Host "Failed to upload to S3: $_" }')
                $lines.Add('    $instanceId = (Invoke-WebRequest -Uri ''http://169.254.169.254/latest/meta-data/instance-id'' -UseBasicParsing).Content')
                $lines.Add('    & ''C:\Program Files\Amazon\AWSCLIV2\aws.exe'' ec2 terminate-instances --instance-ids $instanceId --region $region')
                $lines.Add('}')
                $lines.Add('</powershell>')
                [System.IO.File]::WriteAllLines($udFile, $lines)
                Write-Host "User-data written to $udFile"

            - |
                $env:_USERDATA_FILE = "$env:TEMP\userdata-$env:_BUILD_ID.ps1"
                $windowsInstanceId = (python "$env:TEMP\launch_windows.py").Trim()
                Write-Host "Windows EC2 launched: $windowsInstanceId"
                Write-Host "Polling S3 for build completion (max 90 min)..."

                python "$env:TEMP\poll_s3.py"
                $pollExitCode = $LASTEXITCODE

                python "$env:TEMP\download_report.py"

                if ($pollExitCode -ne 0) {
                    Write-Error "Windows build/test failed or timed out."
                }

    post_build:
        commands:
            - 'Write-Host "=== post_build: tearing down Linux EC2 ==="'
            - |
                if ($env:_LINUX_INSTANCE_ID) {
                    Write-Host "Terminating Linux EC2 $env:_LINUX_INSTANCE_ID..."
                    python "$env:TEMP\teardown_linux.py"
                }

artifacts:
    files:
        - "test-report*.html"
    base-directory: "node"
    discard-paths: yes
