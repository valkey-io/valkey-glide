version: 2

updates:
    # Enable version updates for npm (TypeScript/Node)
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 10
      groups:
          patch-updates:
              update-types:
                  - "patch"
          minor-updates:
              update-types:
                  - "minor"
      labels:
          - "dependencies"
          - "node 🐢"

    # Enable version updates for npm (Node client)
    - package-ecosystem: "npm"
      directory: "/node"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 10
      groups:
          patch-updates:
              update-types:
                  - "patch"
          minor-updates:
              update-types:
                  - "minor"
      labels:
          - "dependencies"
          - "node 🐢"

    # Enable version updates for Gradle (Java)
    - package-ecosystem: "gradle"
      directory: "/java"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 10
      groups:
          patch-updates:
              update-types:
                  - "patch"
          minor-updates:
              update-types:
                  - "minor"
      labels:
          - "dependencies"
          - "java ☕"

    # Enable version updates for Go modules
    - package-ecosystem: "gomod"
      directory: "/go"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 10
      groups:
          patch-updates:
              update-types:
                  - "patch"
          minor-updates:
              update-types:
                  - "minor"
      labels:
          - "dependencies"
          - "go 🏃"

    # Enable version updates for pip (Python)
    - package-ecosystem: "pip"
      directory: "/python"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 10
      groups:
          patch-updates:
              update-types:
                  - "patch"
          minor-updates:
              update-types:
                  - "minor"
      labels:
          - "dependencies"
          - "python 🐍"

    # Enable version updates for GitHub Actions
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 5
      groups:
          patch-updates:
              update-types:
                  - "patch"
          minor-updates:
              update-types:
                  - "minor"
      labels:
          - "dependencies"
          - "github-actions"

    # Enable version updates for npm (Node pm-and-types-tests/depend-on-glide-package)
    - package-ecosystem: npm
      directory: /node/pm-and-types-tests/depend-on-glide-package
      schedule:
          interval: weekly
          day: monday
          time: "09:00"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 10
      groups:
          patch-updates:
              update-types:
                  - "patch"
          minor-updates:
              update-types:
                  - "minor"
      labels:
          - "dependencies"
          - "node 🐢"

    # Enable version updates for npm (Node pm-and-types-tests/depend-on-glide-dependent)
    - package-ecosystem: npm
      directory: /node/pm-and-types-tests/depend-on-glide-dependent
      schedule:
          interval: weekly
          day: monday
          time: "09:00"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 10
      groups:
          patch-updates:
              update-types:
                  - "patch"
          minor-updates:
              update-types:
                  - "minor"
      labels:
          - "dependencies"
          - "node 🐢"

    # --- Rust crates --------------------------------------------------------------------------- #

    # Label node 'cargo-rust' so that it can be re-used to avoid duplication.
    - &cargo-rust
      package-ecosystem: "cargo"
      directories:
          - "/glide-logger"
          - "/glide-telemetry"
          - "/glide-core/redis-rs"
          - "/glide-core"
          - "/rust"
          - "/ffi"
          - "/benchmarks/rust"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 10
      groups:
          patch-updates:
              update-types:
                  - "patch"
          minor-updates:
              update-types:
                  - "minor"
      labels:
          - "dependencies"
          - "Rust ⚙️"

    - <<: *cargo-rust
      directories:
          - "/java"
      labels:
          - "dependencies"
          - "Rust ⚙️"
          - "java ☕"

    - <<: *cargo-rust
      directories:
          - "/python/glide-async"
          - "/python/glide-shared"
      labels:
          - "dependencies"
          - "Rust ⚙️"
          - "python 🐍"

    - <<: *cargo-rust
      directories:
          - "/node/rust-client"
      labels:
          - "dependencies"
          - "Rust ⚙️"
          - "node 🐢"
