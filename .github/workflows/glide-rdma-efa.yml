name: glide-rdma EFA hardware test

# Like Windows CI, GitHub dispatches CodeBuild and monitors the result.
# CodeBuild owns the EC2 pair, tests, and teardown, even if this run is cancelled.
on:
    workflow_dispatch:
        inputs:
            keep_hosts:
                description: "Leave the EFA pair up on failure for diagnosis"
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    test-efa:
        name: EFA hardware test via CodeBuild
        runs-on: ubuntu-24.04
        environment: AWS_ACTIONS
        # All branches share one CodeBuild project. Wait here rather than use
        # its short build queue, and let the active run finish teardown.
        concurrency:
            group: glide-rdma-efa
            cancel-in-progress: false
        permissions:
            id-token: write
            contents: read
        # CodeBuild allows 10 minutes queued plus 90 minutes running.
        timeout-minutes: 120
        steps:
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
              with:
                  role-to-assume: ${{ secrets.AWS_RDMA_ROLE_ARN }}
                  aws-region: us-east-1
                  role-duration-seconds: 7200

            - name: Trigger CodeBuild
              env:
                  SOURCE_VERSION: ${{ github.sha }}
                  KEEP_HOSTS: ${{ inputs.keep_hosts }}
              run: |
                  BUILD_ID=$(aws codebuild start-build \
                    --project-name GlideRdmaEfa \
                    --source-version "$SOURCE_VERSION" \
                    --idempotency-token "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
                    --environment-variables-override \
                      "name=KEEP_HOSTS,value=$KEEP_HOSTS,type=PLAINTEXT" \
                    --query 'build.id' --output text)
                  echo "CODEBUILD_BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
                  echo "Started CodeBuild: $BUILD_ID"
                  echo "CodeBuild: \`$BUILD_ID\` (source \`$SOURCE_VERSION\`)" >> "$GITHUB_STEP_SUMMARY"

            - name: Wait for CodeBuild
              run: |
                  deadline=$((SECONDS + 6600))
                  while (( SECONDS < deadline )); do
                    STATUS=$(aws codebuild batch-get-builds --ids "$CODEBUILD_BUILD_ID" \
                      --query 'builds[0].buildStatus' --output text)
                    echo "CodeBuild: $STATUS"
                    case "$STATUS" in
                      SUCCEEDED) exit 0 ;;
                      FAILED|FAULT|STOPPED|TIMED_OUT)
                        echo "::error::CodeBuild $CODEBUILD_BUILD_ID finished with $STATUS"
                        exit 1 ;;
                      IN_PROGRESS) sleep 30 ;;
                      *) echo "::error::Unexpected CodeBuild status: $STATUS"; exit 1 ;;
                    esac
                  done
                  echo "::error::Monitoring timed out. CodeBuild owns teardown; inspect $CODEBUILD_BUILD_ID."
                  exit 1

            - name: Report build result
              if: always() && env.CODEBUILD_BUILD_ID != ''
              # Diagnostics must not replace the monitoring step's result.
              continue-on-error: true
              timeout-minutes: 2
              run: |
                  python3 - <<'PYTHON'
                  import html
                  import json
                  import os
                  import re
                  import subprocess
                  import uuid
                  from urllib.parse import urlparse

                  summary = os.environ["GITHUB_STEP_SUMMARY"]
                  build_id = os.environ["CODEBUILD_BUILD_ID"]

                  def append(text):
                      with open(summary, "a") as output:
                          output.write(text + "\n")

                  def report(label, text):
                      # Treat remote output as data, including workflow commands and HTML.
                      print(f"{label}:\n{text}", flush=True)
                      append(f"<p>{html.escape(label)}</p><pre>{html.escape(text)}</pre>")

                  def aws(*args):
                      result = subprocess.run(
                          ["aws", *args, "--output", "json", "--no-cli-pager",
                           "--cli-connect-timeout", "10", "--cli-read-timeout", "30"],
                          env=dict(os.environ, AWS_MAX_ATTEMPTS="1"),
                          capture_output=True, text=True, timeout=45, check=False,
                      )
                      if result.returncode:
                          code = re.search(r"An error occurred \((\w+)\)", result.stderr or result.stdout)
                          raise RuntimeError(code[1] if code else f"aws exited {result.returncode}")
                      return json.loads(result.stdout)

                  def failure_reason(error):
                      if isinstance(error, subprocess.TimeoutExpired):
                          return "timed out"
                      if isinstance(error, ValueError):
                          return "unreadable response"
                      return str(error)

                  # This log is public, and the build log carries account and network
                  # identifiers, so only lines with a fixed, identifier-free shape are
                  # printed from it.
                  STEP_ARG = re.compile(r"bin/(?:rdma-pair|run-on)\.sh|apply|down|server|client"
                                        r"|host/\d{2}-[a-z0-9-]+\.sh|GLIDE_SOURCE=[0-9a-f]{40}")
                  # Python 3.15 dropped the quotes around the list in CalledProcessError.
                  FAILED_COMMAND = re.compile(
                      r"EFA build failed: Command '?\[(.*)\]'? (returned non-zero exit status \d+\."
                      r"|died with <Signals\.SIG[A-Z0-9]+: \d+>\.|timed out after [\d.]+ seconds)")
                  FIXED_FAILURE = re.compile(r"EFA build failed: (EFA orchestration exceeded its 65 minute work budget"
                                             r"|Received signal \d+)")
                  TEST_COUNTS = re.compile(r"=+ ((?:\d+ (?:passed|failed|skipped|deselected|xfailed|xpassed|errors?"
                                           r"|warnings?)(?:, )?)+) in [\d.]+s(?: \(\d+:\d\d:\d\d\))? =+")
                  CODEBUILD_ENUM = re.compile(r"[A-Z_]+")

                  def failed_step(lines):
                      for line in reversed(lines):
                          fixed = FIXED_FAILURE.fullmatch(line)
                          if fixed:
                              return fixed[1]
                          match = FAILED_COMMAND.fullmatch(line)
                          if match:
                              args = re.findall(r"'([^']*)'", match[1])
                              # Rebuilding the list rejects an argument that hides a quote
                              # or comma, which the per-argument allowlist cannot see.
                              if (", ".join(f"'{arg}'" for arg in args) == match[1]
                                      and all(STEP_ARG.fullmatch(arg) for arg in args)):
                                  return " ".join(args) + " " + match[2].rstrip(".")
                              return None
                      return None

                  def test_counts(lines):
                      for line in reversed(lines):
                          match = TEST_COUNTS.fullmatch(line)
                          if match:
                              return match[1]
                      return None

                  def main():
                      report("CodeBuild", build_id)
                      try:
                          response = aws("codebuild", "batch-get-builds", "--ids", build_id)
                          builds = response.get("builds", [])
                          if not builds:
                              raise RuntimeError("Build metadata was not returned.")
                          build = builds[0]
                      except (RuntimeError, ValueError, subprocess.TimeoutExpired) as error:
                          report("Build diagnostics unavailable", failure_reason(error))
                          return

                      status = build.get("buildStatus", "UNKNOWN")
                      report("Build status", status)
                      logs = build.get("logs") or {}
                      url = logs.get("deepLink", "")
                      if urlparse(url).scheme == "https":
                          append(f'<p><a href="{html.escape(url, quote=True)}">CodeBuild logs</a></p>')
                      if status == "SUCCEEDED":
                          return

                      phases = []
                      for phase in build.get("phases", []):
                          if phase.get("phaseStatus") in ("FAILED", "FAULT", "STOPPED", "TIMED_OUT"):
                              # Context messages can name the account's resources; the status code cannot.
                              codes = sorted({c.get("statusCode", "") for c in phase.get("contexts", [])} - {""})
                              fields = [str(phase.get("phaseType", "")), phase["phaseStatus"], *codes]
                              phases.append(" ".join(f if CODEBUILD_ENUM.fullmatch(f) else "?" for f in fields))
                      report("Phase errors", "\n".join(phases) or "No phase error details returned.")
                      if not logs.get("groupName") or not logs.get("streamName"):
                          report("Log summary unavailable", "CodeBuild has not provided a CloudWatch log stream.")
                          return
                      try:
                          page = aws("logs", "get-log-events", "--log-group-name", logs["groupName"],
                                     "--log-stream-name", logs["streamName"], "--limit", "200",
                                     "--no-start-from-head", "--no-paginate")
                          lines = [line.strip() for event in page.get("events", [])
                                   for line in str(event.get("message", "")).splitlines()]
                      except (RuntimeError, ValueError, subprocess.TimeoutExpired) as error:
                          report("Log summary unavailable", failure_reason(error))
                          return
                      if not lines:
                          report("Log summary unavailable", "CloudWatch returned no events; logs may not have arrived yet.")
                          return
                      report("Failed step", failed_step(lines) or "No recognized failure line in the last 200 log events.")
                      report("Test results", test_counts(lines) or "No pytest summary in the last 200 log events.")
                      report("Full log", "Maintainers can read the CodeBuild log; ask on the PR.")

                  token = uuid.uuid4().hex
                  print(f"::stop-commands::{token}", flush=True)
                  try:
                      main()
                  finally:
                      print(f"::{token}::", flush=True)
                  PYTHON
