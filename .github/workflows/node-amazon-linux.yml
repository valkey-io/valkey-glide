# Isolated from node.yml to prevent Amazon Linux container flakiness
# from cancelling or blocking other Node.js jobs.
# We should remove this and re-enable Amazon Linux testing in node.yml
# once the flakiness is resolved.
name: Node Amazon Linux CI

permissions:
    contents: read

on:
    push:
        branches:
            - main
            - release-*
            - v*
        paths:
            - glide-core/src/**
            - glide-core/redis-rs/redis/src/**
            - node/**
            - utils/cluster_manager.py
            - .github/workflows/node-amazon-linux.yml
            - .github/workflows/install-shared-dependencies/action.yml
            - .github/workflows/install-engine/action.yml
            - .github/workflows/create-test-matrices/action.yml
            - .github/json_matrices/**

    pull_request:
        paths:
            - glide-core/src/**
            - glide-core/redis-rs/redis/src/**
            - node/**
            - utils/cluster_manager.py
            - .github/workflows/node-amazon-linux.yml
            - .github/workflows/install-shared-dependencies/action.yml
            - .github/workflows/install-engine/action.yml
            - .github/workflows/create-test-matrices/action.yml
            - .github/json_matrices/**

    # Nightly full-matrix run at 1:00 AM UTC, scheduled after node.yml
    schedule:
        - cron: "0 1 * * *"

    workflow_dispatch:
        inputs:
            full-matrix:
                description: "Run the full engine, host, and language version matrix"
                type: boolean
                default: false
            name:
                required: false
                type: string
                description: "(Optional) Test run name"
    workflow_call:
        inputs:
            run-with-macos:
                description: "Unused, kept for interface compatibility"
                type: string
                default: false

concurrency:
    group: node-amazon-linux-${{ github.head_ref || github.ref }}-${{ toJson(inputs) }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always

run-name: ${{ github.event_name == 'workflow_dispatch' && (inputs.name == '' && format('{0} @ {1} {2}', github.ref_name, github.sha, toJson(inputs)) || inputs.name) || '' }}

jobs:
    get-containers:
        runs-on: ubuntu-latest
        if: ${{ github.event.inputs.full-matrix == 'true' || github.event_name == 'schedule' }}
        outputs:
            engine-matrix-output: ${{ steps.get-matrices.outputs.engine-matrix-output }}
            host-matrix-output: ${{ steps.filter-hosts.outputs.host-matrix }}
            version-matrix-output: ${{ steps.get-matrices.outputs.version-matrix-output }}

        steps:
            - uses: actions/checkout@v4
            - id: get-matrices
              uses: ./.github/workflows/create-test-matrices
              with:
                  language-name: node
                  run-full-matrix: true
                  containers: true
            - id: filter-hosts
              shell: bash
              run: |
                  echo "host-matrix=$(echo '${{ steps.get-matrices.outputs.host-matrix-output }}' | jq -c '[.[] | select(.OS == "amazon-linux")]')" >> $GITHUB_OUTPUT

    test-node-container:
        runs-on: ${{ matrix.host.RUNNER }}
        needs: [get-containers]
        timeout-minutes: 35
        strategy:
            fail-fast: false
            matrix:
                node: ${{ fromJson(needs.get-containers.outputs.version-matrix-output) }}
                engine: ${{ fromJson(needs.get-containers.outputs.engine-matrix-output) }}
                host: ${{ fromJson(needs.get-containers.outputs.host-matrix-output) }}
        container:
            image: ${{ matrix.host.IMAGE }}
            options: ${{ join(' -q ', matrix.host.CONTAINER_OPTIONS) }} # adding `-q` to bypass empty options
        steps:
            - name: Install git and required tools
              run: |
                  yum install -y git tar which
                  yum install -y --allowerasing curl

            - name: Create directory structure if needed
              run: mkdir -p $GITHUB_WORKSPACE

            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set permissions after checkout
              run: chown -R $(id -u):$(id -g) $GITHUB_WORKSPACE

            - name: Install shared dependencies
              uses: ./.github/workflows/install-shared-dependencies
              with:
                  os: ${{ matrix.host.OS }}
                  target: ${{ matrix.host.TARGET }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  engine-version: ${{ matrix.engine.version }}

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node }}

            - uses: actions/cache@v4
              with:
                  path: |
                      node/rust-client/target
                      glide-core/src/generated
                  key: ${{ matrix.host.IMAGE }}-node
                  restore-keys: ${{ matrix.host.IMAGE }}

            - name: Build and Test
              working-directory: ./node
              run: |
                  npm run build
                  npm run test

            - name: Sanitize IMAGE variable
              # Replace `:` in the variable otherwise it can't be used in `upload-artifact`
              run: echo "SANITIZED_IMAGE=${{ matrix.host.IMAGE }}" | sed -r 's/:/-/g' >> $GITHUB_ENV

            - name: Upload test reports
              continue-on-error: true
              uses: actions/upload-artifact@v4
              with:
                  name: test-report-node-${{ matrix.node }}-${{ matrix.engine.type }}-${{ matrix.engine.version }}-${{ env.SANITIZED_IMAGE }}-${{ matrix.host.ARCH }}
                  path: |
                      node/test-report*.html
                      utils/clusters/**
                      benchmarks/results/**
