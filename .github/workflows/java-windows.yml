# Isolated from java.yml to prevent Windows flakiness (20.8% failure rate)
# from cancelling or blocking non-Windows Java jobs (1.4–6.4% failure rate).
name: Java Windows CI

permissions:
    contents: read

on:
    push:
        branches:
            - main
            - release-*
            - v*
        paths:
            - glide-core/src/**
            - glide-core/redis-rs/redis/src/**
            - java/**
            - utils/cluster_manager.py
            - .github/workflows/java-windows.yml
            - .github/workflows/install-shared-dependencies/action.yml
            - .github/workflows/install-engine/action.yml
            - .github/workflows/create-test-matrices/action.yml
            - .github/json_matrices/**

    pull_request:
        paths:
            - glide-core/src/**
            - glide-core/redis-rs/redis/src/**
            - java/**
            - utils/cluster_manager.py
            - .github/workflows/java-windows.yml
            - .github/workflows/install-shared-dependencies/action.yml
            - .github/workflows/install-engine/action.yml
            - .github/workflows/create-test-matrices/action.yml
            - .github/json_matrices/**

    # Nightly full-matrix run at 2:00 AM UTC, scheduled after java.yml (non-Windows) completes
    schedule:
        - cron: "0 2 * * *"

    workflow_dispatch:
        inputs:
            full-matrix:
                description: "Run the full engine, host, and language version matrix"
                type: boolean
                default: false
            name:
                required: false
                type: string
                description: "(Optional) Test run name"
    workflow_call:
        inputs:
            run-with-macos:
                description: "Unused, kept for interface compatibility"
                type: string
                default: false

concurrency:
    group: java-windows-${{ github.head_ref || github.ref }}-${{ toJson(inputs) }}
    cancel-in-progress: true

run-name:
    ${{ github.event_name == 'workflow_dispatch' && (inputs.name == '' && format('{0} @ {1} {2}', github.ref_name, github.sha, toJson(inputs)) || inputs.name) || '' }}

jobs:
    get-matrices:
        runs-on: ubuntu-latest
        outputs:
            engine-matrix-output: ${{ steps.get-matrices.outputs.engine-matrix-output }}
            host-matrix-output: ${{ steps.filter-hosts.outputs.host-matrix }}
            version-matrix-output: ${{ steps.get-matrices.outputs.version-matrix-output }}
        steps:
            - uses: actions/checkout@v4
            - id: get-matrices
              uses: ./.github/workflows/create-test-matrices
              with:
                  language-name: java
                  run-full-matrix: ${{ github.event.inputs.full-matrix == 'true' || github.event_name == 'schedule' }}
            - id: filter-hosts
              shell: bash
              run: |
                  echo "host-matrix=$(echo '${{ steps.get-matrices.outputs.host-matrix-output }}' | jq -c '[.[] | select(.OS == "windows")]')" >> $GITHUB_OUTPUT

    test-java:
        name: Java Windows Tests - ${{ matrix.java }}, EngineVersion - ${{ matrix.engine.version }}, Target - ${{ matrix.host.TARGET }}
        needs: get-matrices
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                java: ${{ fromJson(needs.get-matrices.outputs.version-matrix-output) }}
                engine: ${{ fromJson(needs.get-matrices.outputs.engine-matrix-output) }}
                host: ${{ fromJson(needs.get-matrices.outputs.host-matrix-output) }}
        runs-on: ${{ matrix.host.RUNNER }}
        env:
            VALKEY_GLIDE_DNS_TESTS_ENABLED: "1"

        steps:
            - uses: actions/checkout@v4

            - name: Output Matrix Parameters for this job
              run: |
                  echo "Job running with the following matrix configuration:"
                  echo "${{ toJson(matrix) }}"

            - uses: gradle/actions/wrapper-validation@v4

            - name: Set up JDK ${{ matrix.java }}
              uses: actions/setup-java@v4
              with:
                  distribution: ${{ matrix.java == '8' && 'corretto' || 'temurin' }}
                  java-version: ${{ matrix.java }}

            - name: Set up JDK 11 (for Java 8 compilation)
              if: matrix.java == '8'
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 11

            - name: Install shared software dependencies
              uses: ./.github/workflows/install-shared-dependencies
              with:
                  os: ${{ matrix.host.OS }}
                  target: ${{ matrix.host.TARGET }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  engine-version: ${{ matrix.engine.version }}
                  language: java

            - name: Install protoc (protobuf)
              uses: arduino/setup-protoc@v3
              with:
                  version: "29.1"
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - uses: actions/cache@v4
              with:
                  path: |
                      java/target
                      glide-core/src/generated
                  key: ${{ matrix.host.TARGET }}-java
                  restore-keys: |
                      ${{ matrix.host.TARGET }}-glide-core
                      ${{ matrix.host.TARGET }}

            - name: Cache Gradle dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: ${{ runner.os }}-gradle-${{ hashFiles('java/**/*.gradle*', 'java/**/gradle-wrapper.properties') }}
                  restore-keys: |
                      ${{ runner.os }}-gradle-

            - uses: ./.github/actions/setup-dns-tests
              with:
                  os: ${{ matrix.host.OS }}

            - name: Build java client
              working-directory: java
              shell: bash
              run: |
                  export AWS_ACCESS_KEY_ID=test_access_key
                  export AWS_SECRET_ACCESS_KEY=test_secret_key
                  export AWS_SESSION_TOKEN=test_session_token
                  if [[ "${{ matrix.java }}" == "8" ]]; then
                      ./gradlew.bat --build-cache --continue build test -x javadoc -PtestJava8=true
                  else
                      ./gradlew.bat --build-cache --continue build test -x javadoc
                  fi

            - name: Ensure no skipped files by linter
              working-directory: java
              shell: bash
              run: |
                  ./gradlew.bat --build-cache spotlessDiagnose | grep 'All formatters are well behaved for all files'

            - name: Upload test & spotbugs reports
              if: always()
              continue-on-error: true
              uses: actions/upload-artifact@v4
              with:
                  name: test-reports-java-windows-${{ matrix.java }}-${{ matrix.engine.type }}-${{ matrix.engine.version }}-${{ matrix.host.OS }}-${{ matrix.host.ARCH }}
                  path: |
                      java/client/build/reports/**
                      java/integTest/build/reports/**
                      utils/clusters/**
                      java/client/build/reports/spotbugs/**

    test-pubsub:
        name: Java Windows PubSubTests - ${{ matrix.java }}, EngineVersion - ${{ matrix.engine.version }}, Target - ${{ matrix.host.TARGET }}
        needs: get-matrices
        timeout-minutes: 35
        strategy:
            fail-fast: false
            matrix:
                java: ${{ fromJson(needs.get-matrices.outputs.version-matrix-output) }}
                engine: ${{ fromJson(needs.get-matrices.outputs.engine-matrix-output) }}
                host: ${{ fromJson(needs.get-matrices.outputs.host-matrix-output) }}
        runs-on: ${{ matrix.host.RUNNER }}

        steps:
            - uses: actions/checkout@v4

            - name: Output Matrix Parameters for this job
              run: |
                  echo "Job running with the following matrix configuration:"
                  echo "${{ toJson(matrix) }}"

            - name: Set up JDK ${{ matrix.java }}
              uses: actions/setup-java@v4
              with:
                  distribution: ${{ matrix.java == '8' && 'corretto' || 'temurin' }}
                  java-version: ${{ matrix.java }}

            - name: Set up JDK 11 (for Java 8 compilation)
              if: matrix.java == '8'
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 11

            - name: Install shared software dependencies
              uses: ./.github/workflows/install-shared-dependencies
              with:
                  os: ${{ matrix.host.OS }}
                  target: ${{ matrix.host.TARGET }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  engine-version: ${{ matrix.engine.version }}
                  language: java

            - name: Install protoc (protobuf)
              uses: arduino/setup-protoc@v3
              with:
                  version: "29.1"
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - uses: actions/cache@v4
              with:
                  path: |
                      java/target
                      glide-core/src/generated
                  key: ${{ matrix.host.TARGET }}-java
                  restore-keys: |
                      ${{ matrix.host.TARGET }}-glide-core
                      ${{ matrix.host.TARGET }}

            - name: Cache Gradle dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: ${{ runner.os }}-gradle-${{ hashFiles('java/**/*.gradle*', 'java/**/gradle-wrapper.properties') }}
                  restore-keys: |
                      ${{ runner.os }}-gradle-

            - name: Test pubsub
              working-directory: java
              shell: bash
              run: |
                  if [[ "${{ matrix.java }}" == "8" ]]; then
                      ./gradlew.bat --build-cache :integTest:pubsubTest -PtestJava8=true
                  else
                      ./gradlew.bat --build-cache :integTest:pubsubTest
                  fi

            - name: Upload test & spotbugs reports
              if: always()
              continue-on-error: true
              uses: actions/upload-artifact@v4
              with:
                  name: test-reports-pubsub-java-windows-${{ matrix.java }}-${{ matrix.engine.type }}-${{ matrix.engine.version }}-${{ matrix.host.OS }}-${{ matrix.host.ARCH }}
                  path: |
                      java/integTest/build/reports/**
                      utils/clusters/**
