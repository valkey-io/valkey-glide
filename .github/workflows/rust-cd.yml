name: Rust - Continuous Deployment

on:
    workflow_dispatch:
        inputs:
            publish:
                description: "Publish to crates.io"
                required: true
                type: boolean
                default: false

concurrency:
    group: rust-cd-${{ github.ref }}
    # Never cancel a publish that is in progress.
    cancel-in-progress: false

permissions:
    contents: read

# TODO #7261: Replace with `cargo publish --workspace`.
jobs:
    validate-branch:
        # Skips this and all dependent jobs on forks.
        if: github.repository_owner == 'valkey-io'
        runs-on: ubuntu-latest
        steps:
            - name: Validate branch
              if: ${{ inputs.publish }}
              run: |
                  if [[ "${GITHUB_REF}" != refs/heads/release-* ]]; then
                      echo "Publishing is only allowed from release-* branches, not ${GITHUB_REF}."
                      exit 1
                  fi

    # --- glide-logger crate ----------------------------------------------------------------------

    test-glide-logger:
        needs: [validate-branch]
        uses: ./.github/workflows/glide-logger.yml

    publish-glide-logger:
        needs: [test-glide-logger]
        runs-on: ubuntu-latest
        environment: AWS_ACTIONS
        permissions:
            contents: read
            # Required for crates.io trusted publishing (OIDC).
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install Rust toolchain
              uses: ./.github/actions/install-rust

            - name: Publish glide-logger
              uses: ./.github/workflows/publish-rust-crate
              with:
                  crate: glide-logger
                  publish: ${{ inputs.publish }}
