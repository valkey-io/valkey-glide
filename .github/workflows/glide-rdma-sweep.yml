# Backstop teardown for the EFA test pair driven by glide-rdma-efa.yml. The in-job
# always() teardown there handles the normal path, and each host self-terminates
# after MaxHostLifetimeMinutes (see glide-rdma/ci/efa/infra/rdma-pair.yaml) so a
# hard job cancellation cannot bill the instances. This sweep reclaims the STACK
# SHELL (placement group, security group, launch template, IAM instance
# role/profile) that a hard-killed run leaves behind: it deletes any
# rdma-ci-<run_id> stack older than the cutoff.
#
# It uses the same OIDC role as test-efa (secret AWS_RDMA_ROLE_ARN), which
# grants cloudformation:ListStacks + DeleteStack + DescribeStacks on rdma-ci-*
# (see glide-rdma/ci/efa/infra/github-role.yaml). The schedule is best-effort
# (GitHub may lag or skip under load), which is fine for a janitor;
# workflow_dispatch allows an on-demand run.

name: glide-rdma sweep

on:
    schedule:
        # Hourly. GitHub scheduled runs are best-effort, not guaranteed on time.
        - cron: "17 * * * *"
    workflow_dispatch:
        inputs:
            max_age_minutes:
                description: "Delete rdma-ci-<run_id> stacks older than this many minutes"
                type: string
                default: "240"

permissions:
    contents: read

jobs:
    sweep:
        name: Delete stale rdma-ci stacks
        runs-on: ubuntu-24.04
        # Same approval gate as the test job: deleting stacks is a real AWS action.
        environment: AWS_ACTIONS
        permissions:
            id-token: write
            contents: read
        timeout-minutes: 15
        steps:
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
              with:
                  role-to-assume: ${{ secrets.AWS_RDMA_ROLE_ARN }}
                  aws-region: us-east-1

            - name: Delete stale rdma-ci stacks
              env:
                  MAX_AGE_MINUTES: ${{ github.event.inputs.max_age_minutes || '240' }}
              run: |
                  set -euo pipefail
                  now=$(date -u +%s)
                  cutoff=$(( now - MAX_AGE_MINUTES * 60 ))

                  # Settled states only. A hard-killed run's stack ends up here;
                  # CREATE_IN_PROGRESS is excluded so a slow-but-live create is
                  # never deleted out from under a running job.
                  mapfile -t names < <(aws cloudformation list-stacks \
                    --stack-status-filter CREATE_COMPLETE CREATE_FAILED \
                      ROLLBACK_COMPLETE ROLLBACK_FAILED UPDATE_COMPLETE UPDATE_ROLLBACK_COMPLETE \
                    --query "StackSummaries[].StackName" --output text | tr '\t' '\n')

                  deleted=0
                  for name in "${names[@]}"; do
                    # Only per-run stacks: rdma-ci- followed by a numeric GitHub run id.
                    # This never matches the permanent rdma-ci-github-role stack.
                    [[ "$name" =~ ^rdma-ci-[0-9]+$ ]] || continue

                    # A stack can vanish between list and describe (a racing teardown);
                    # skip it rather than aborting the whole sweep under set -e.
                    created=$(aws cloudformation describe-stacks --stack-name "$name" \
                      --query "Stacks[0].CreationTime" --output text 2>/dev/null || true)
                    [ -n "$created" ] || { echo "Skipping $name (no longer present)"; continue; }

                    # The runner is GNU date; an unparseable timestamp skips, not aborts.
                    created_epoch=$(date -u -d "$created" +%s 2>/dev/null || true)
                    [ -n "$created_epoch" ] || { echo "Skipping $name (unparseable CreationTime '$created')"; continue; }

                    if [ "$created_epoch" -lt "$cutoff" ]; then
                      age_min=$(( (now - created_epoch) / 60 ))
                      echo "Deleting $name (age ${age_min}m > ${MAX_AGE_MINUTES}m cutoff)"
                      aws cloudformation delete-stack --stack-name "$name"
                      deleted=$(( deleted + 1 ))
                    else
                      echo "Keeping $name (younger than ${MAX_AGE_MINUTES}m)"
                    fi
                  done
                  echo "Swept ${#names[@]} stacks, deleted ${deleted}."
