name: Test Shared Actions

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/workflows/semgrep.yml'
      - '.github/workflows/git-secrets-scan.yml'
  workflow_dispatch: {}

jobs:
  test-install-dependencies:
    name: Test install-shared-dependencies (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install shared dependencies
        uses: ./.github/actions/install-shared-dependencies
        with:
          os: ${{ matrix.os }}
          engine-version: '8.1'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Valkey installation (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "=== Verifying Valkey installation ==="
          valkey-server --version
          valkey-cli --version
          echo "=== Valkey installation verified ==="

      - name: Verify Valkey installation (Windows non-ARM64)
        if: runner.os == 'Windows' && runner.arch != 'ARM64'
        shell: wsl-bash {0}
        run: |
          echo "=== Verifying Valkey installation (WSL) ==="
          valkey-server --version || echo "valkey-server not in PATH in WSL"
          valkey-cli --version || echo "valkey-cli not in PATH in WSL"
          ~/valkey-install/bin/valkey-server --version
          ~/valkey-install/bin/valkey-cli --version
          echo "=== Valkey installation verified ==="

      - name: Verify backward-compatible symlinks (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "=== Verifying backward-compatible redis-* symlinks ==="
          redis-server --version
          redis-cli --version
          echo "=== Symlinks verified ==="

  test-install-engine:
    name: Test install-engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Valkey engine
        uses: ./.github/actions/install-engine
        with:
          engine-version: '8.1'

      - name: Verify Valkey version
        run: |
          echo "=== Verifying Valkey engine installation ==="
          INSTALLED_VERSION=$(valkey-server --version | grep -oP 'v=\K[0-9]+\.[0-9]+' || valkey-server --version)
          echo "Installed Valkey version: $INSTALLED_VERSION"
          valkey-server --version
          echo "=== Installation verified ==="

      - name: Verify cache output
        run: |
          echo "Cache key was computed and used for Valkey installation"
          echo "Backward-compatible redis-* symlinks should be available"
          redis-server --version
          redis-cli --version

  test-docker-action:
    name: Test start-valkey-docker (default ports)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Valkey CLI for testing
        uses: ./.github/actions/install-engine
        with:
          engine-version: '8.1'

      - name: Start Valkey Docker servers
        uses: ./.github/actions/start-valkey-docker
        with:
          standalone-port: '16389'
          cluster-port-start: '18001'

      - name: Verify standalone server
        run: |
          echo "=== Verifying standalone server on port 16389 ==="
          valkey-cli -p 16389 PING
          valkey-cli -p 16389 INFO server | head -20
          echo "=== Standalone server verified ==="

      - name: Verify cluster
        run: |
          echo "=== Verifying cluster on ports 18001-18006 ==="
          valkey-cli -p 18001 CLUSTER INFO
          valkey-cli -p 18001 CLUSTER NODES
          echo "=== Cluster verified ==="

  test-custom-ports:
    name: Test start-valkey-docker (custom ports)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Valkey CLI for testing
        uses: ./.github/actions/install-engine
        with:
          engine-version: '8.1'

      - name: Start Valkey Docker with custom ports
        uses: ./.github/actions/start-valkey-docker
        with:
          standalone-port: '7000'
          cluster-port-start: '7100'

      - name: Verify custom standalone port
        run: |
          echo "=== Verifying standalone server on custom port 7000 ==="
          valkey-cli -p 7000 PING
          echo "=== Custom standalone port verified ==="

      - name: Verify custom cluster ports
        run: |
          echo "=== Verifying cluster on custom ports 7100-7105 ==="
          valkey-cli -p 7100 PING
          valkey-cli -p 7101 PING
          valkey-cli -p 7102 PING
          valkey-cli -p 7100 CLUSTER INFO
          echo "=== Custom cluster ports verified ==="

  test-backward-compat:
    name: Test backward compatibility (environment variables)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Valkey CLI for testing
        uses: ./.github/actions/install-engine
        with:
          engine-version: '8.1'

      - name: Start Valkey Docker servers
        uses: ./.github/actions/start-valkey-docker

      - name: Verify MODULES_STANDALONE_ENDPOINT
        run: |
          echo "=== Verifying MODULES_STANDALONE_ENDPOINT ==="
          echo "MODULES_STANDALONE_ENDPOINT=$MODULES_STANDALONE_ENDPOINT"

          # Check that the variable is set and non-empty
          if [[ -z "$MODULES_STANDALONE_ENDPOINT" ]]; then
            echo "::error::MODULES_STANDALONE_ENDPOINT is not set"
            exit 1
          fi

          # Verify format matches expected pattern (localhost:port)
          if [[ ! "$MODULES_STANDALONE_ENDPOINT" =~ ^localhost:[0-9]+$ ]]; then
            echo "::error::MODULES_STANDALONE_ENDPOINT format is invalid: $MODULES_STANDALONE_ENDPOINT"
            exit 1
          fi

          echo "MODULES_STANDALONE_ENDPOINT is valid: $MODULES_STANDALONE_ENDPOINT"

      - name: Verify MODULES_CLUSTER_ENDPOINTS
        run: |
          echo "=== Verifying MODULES_CLUSTER_ENDPOINTS ==="
          echo "MODULES_CLUSTER_ENDPOINTS=$MODULES_CLUSTER_ENDPOINTS"

          # Check that the variable is set and non-empty
          if [[ -z "$MODULES_CLUSTER_ENDPOINTS" ]]; then
            echo "::error::MODULES_CLUSTER_ENDPOINTS is not set"
            exit 1
          fi

          # Verify format matches expected pattern (comma-separated localhost:port entries)
          if [[ ! "$MODULES_CLUSTER_ENDPOINTS" =~ ^localhost:[0-9]+(,localhost:[0-9]+)*$ ]]; then
            echo "::error::MODULES_CLUSTER_ENDPOINTS format is invalid: $MODULES_CLUSTER_ENDPOINTS"
            exit 1
          fi

          # Verify we have 6 cluster endpoints
          ENDPOINT_COUNT=$(echo "$MODULES_CLUSTER_ENDPOINTS" | tr ',' '\n' | wc -l)
          if [[ "$ENDPOINT_COUNT" -ne 6 ]]; then
            echo "::error::Expected 6 cluster endpoints, got $ENDPOINT_COUNT"
            exit 1
          fi

          echo "MODULES_CLUSTER_ENDPOINTS is valid with $ENDPOINT_COUNT endpoints"

      - name: Verify endpoints are reachable
        run: |
          echo "=== Verifying endpoints are reachable ==="

          # Extract port from standalone endpoint and verify
          STANDALONE_PORT=${MODULES_STANDALONE_ENDPOINT#localhost:}
          echo "Testing standalone on port $STANDALONE_PORT..."
          valkey-cli -p "$STANDALONE_PORT" PING | grep -q PONG
          echo "Standalone endpoint verified"

          # Test each cluster endpoint
          echo "Testing cluster endpoints..."
          IFS=',' read -ra ENDPOINTS <<< "$MODULES_CLUSTER_ENDPOINTS"
          for endpoint in "${ENDPOINTS[@]}"; do
            PORT=${endpoint#localhost:}
            echo "  Testing port $PORT..."
            valkey-cli -p "$PORT" PING | grep -q PONG
          done
          echo "All cluster endpoints verified"
