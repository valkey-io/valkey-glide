name: Rust client tests

permissions:
    contents: read

on:
    push:
        branches:
            - main
            - release-*
            - v*
        paths:
            - rust/**
            - glide-core/**
            - logger_core/**
            - deny.toml
            - utils/cluster_manager.py
            - .github/workflows/rust-client.yml
            - .github/actions/install-shared-dependencies/action.yml
            - .github/actions/install-engine/action.yml
            - .github/workflows/lint-rust/action.yml
    pull_request:
        paths:
            - rust/**
            - glide-core/**
            - logger_core/**
            - deny.toml
            - utils/cluster_manager.py
            - .github/workflows/rust-client.yml
            - .github/actions/install-shared-dependencies/action.yml
            - .github/actions/install-engine/action.yml
            - .github/workflows/lint-rust/action.yml
    workflow_dispatch:

concurrency:
    group: rust-client-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always

jobs:
    lint:
        name: Lint - Rust client
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: ./.github/workflows/lint-rust
              with:
                  cargo-toml-folder: rust
                  github-token: ${{ secrets.GITHUB_TOKEN }}
              name: lint rust client

    tests:
        name: Test - ${{ matrix.engine.type }} ${{ matrix.engine.version }}, ${{ matrix.host.arch }}
        runs-on: ${{ matrix.host.runner }}
        timeout-minutes: 35
        strategy:
            fail-fast: false
            matrix:
                host:
                    - { arch: x64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
                    - { arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
                engine:
                    - { type: valkey, version: "9.0" }
                    - { type: valkey, version: "8.1" }
                    - { type: valkey, version: "8.0" }
                    - { type: valkey, version: "7.2" }
                    - { type: redis, version: "7.0" }
                    - { type: redis, version: "6.2" }
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install shared software dependencies
              uses: ./.github/actions/install-shared-dependencies
              with:
                  os: ubuntu
                  target: ${{ matrix.host.target }}
                  engine-version: ${{ matrix.engine.version }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Run rust client tests
              working-directory: ./rust
              run: cargo test
