name: Rust client CI

permissions:
    contents: read

on:
    push:
        branches:
            - main
            - release-*
            - v*
        paths:
            - rust/**
            - glide-logger/**
            - glide-telemetry/**
            - glide-core/**
            - deny.toml
            - utils/cluster_manager.py
            - .github/actions/install-engine/action.yml
            - .github/actions/install-rust/action.yml
            - .github/actions/install-shared-dependencies/action.yml
            - .github/workflows/lint-rust/action.yml
            - .github/workflows/rust.yml
    pull_request:
        paths:
            - rust/**
            - glide-logger/**
            - glide-telemetry/**
            - glide-core/**
            - deny.toml
            - utils/cluster_manager.py
            - .github/actions/install-engine/action.yml
            - .github/actions/install-rust/action.yml
            - .github/actions/install-shared-dependencies/action.yml
            - .github/workflows/lint-rust/action.yml
            - .github/workflows/rust.yml
    workflow_dispatch:
    workflow_call:

concurrency:
    group: rust-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always

jobs:
    lint:
        name: Lint - Rust client
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: ./.github/workflows/lint-rust
              with:
                  cargo-toml-folder: rust
                  github-token: ${{ secrets.GITHUB_TOKEN }}
              name: lint rust client

    tests:
        name: Test - ${{ matrix.engine.type }} ${{ matrix.engine.version }}, ${{ matrix.host.arch }}
        runs-on: ${{ matrix.host.runner }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                host:
                    - {
                          arch: x64,
                          runner: ubuntu-24.04,
                          target: x86_64-unknown-linux-gnu,
                      }
                    - {
                          arch: arm64,
                          runner: ubuntu-24.04-arm,
                          target: aarch64-unknown-linux-gnu,
                      }
                engine:
                    - { type: valkey, version: "9.0" }
                    - { type: redis, version: "6.2" }
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Determine minimum supported Rust version (MSRV)
              id: msrv
              working-directory: ./rust
              shell: bash
              run: |
                  # Fetch from Cargo.toml (rust-version = "X.Y.Z").
                  msrv=$(awk -F'"' '/^rust-version/ { print $2; exit }' Cargo.toml)
                  if [ -z "$msrv" ]; then
                      echo "::error::rust-version not found in rust/Cargo.toml"
                      exit 1
                  fi
                  echo "toolchain=$msrv" >> "$GITHUB_OUTPUT"

            - name: Install shared software dependencies
              uses: ./.github/actions/install-shared-dependencies
              with:
                  os: ubuntu
                  rust-toolchain: ${{ steps.msrv.outputs.toolchain }}
                  target: ${{ matrix.host.target }}
                  engine-version: ${{ matrix.engine.version }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Run rust client tests
              working-directory: ./rust
              run: cargo test --locked -- --show-output
