name: ORT - Trigger periodic checks for relevant branches

permissions:
    contents: read
    actions: write

on:
    schedule:
        - cron: "0 0 * * *" # Runs daily at 00:00 UTC

jobs:
    trigger-ort-check:
        runs-on: ubuntu-latest
        if: github.repository_owner == 'valkey-io'

        steps:
            - name: Checkout repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0

            - name: Fetch relevant branches
              id: get-branches
              run: |
                  git fetch --tags --quiet

                  # Start with main (always included)
                  branches="main"

                  # Get all release-* branches and filter out fully released ones
                  for branch in $(git ls-remote --heads origin | awk -F'/' '/refs\/heads\/release-/ {print $NF}'); do
                    # Extract version number from branch name (e.g., release-2.5 -> 2.5)
                    version=${branch#release-}

                    # Check if a final (non-RC) tag exists for this branch (e.g., v2.5.0, v2.5.1)
                    latest_final_tag=$(git tag -l "v${version}.*" | grep -v "\-rc" | sort -V | tail -1)

                    if [ -z "$latest_final_tag" ]; then
                      # No final release tag yet - branch is still active
                      branches="$branches $branch"
                      continue
                    fi

                    # Check if there are commits on the branch after the latest final tag
                    tag_commit=$(git rev-list -n 1 "$latest_final_tag")
                    branch_head=$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')

                    if [ "$tag_commit" = "$branch_head" ]; then
                      echo "Skipping $branch: already released ($latest_final_tag) with no new commits"
                      continue
                    fi

                    # Check if commits after the tag are only ORT attribution updates
                    # If all post-tag commits are from ort-bot, the branch is effectively dormant
                    non_ort_commits=$(git log --format="%ae %s" "$latest_final_tag".."origin/$branch" 2>/dev/null \
                      | grep -v "valkey-glide@lists.valkey.io" \
                      | grep -v "Updated attribution files" || true)

                    if [ -z "$non_ort_commits" ]; then
                      echo "Skipping $branch: only ORT commits after $latest_final_tag"
                    else
                      branches="$branches $branch"
                    fi
                  done

                  echo "Active branches for ORT check: $branches"
                  echo "branches=$branches" >> $GITHUB_OUTPUT
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Trigger ORT Check workflows
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      const branches = "${{ steps.get-branches.outputs.branches }}".split(" ");
                      const workflowFile = "ort.yml";

                      const triggerWorkflow = async (branch) => {
                        try {
                          console.log(`Triggering workflow for branch: ${branch}`);
                          await github.rest.actions.createWorkflowDispatch({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            workflow_id: workflowFile,
                            ref: branch, // The branch where workflow_dispatch is triggered
                            inputs: {
                              branch_name: branch
                            }
                          });
                          console.log(`Successfully triggered workflow for branch: ${branch}`);
                        } catch (error) {
                          core.setFailed(error.message);
                        }
                      };

                      // Fire all workflow dispatch requests concurrently
                      const promises = branches
                        .filter(branch => branch) // Skip empty branches
                        .map(branch => triggerWorkflow(branch));

                      await Promise.allSettled(promises);
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
