name: PR Title

# Checks the PR title; release-drafter.yml builds the release notes from it.
# Shared with the other valkey-glide-* repos.
#
# synchronize: a required check must report on every new head commit.
# labeled/unlabeled: re-check once Dependabot adds its `dependencies` label.
# workflow_run: PRs opened with GITHUB_TOKEN (ORT attribution PRs) only get
# approval-gated pull_request runs, so the bot-prs job reports the check for them.
on:
    pull_request:
        types: [opened, edited, reopened, synchronize, labeled, unlabeled]
    workflow_run:
        workflows: ["The OSS Review Toolkit (ORT)"]
        types: [completed]
    # Callers must grant contents: read, pull-requests: read and statuses: write.
    workflow_call:
        inputs:
            check-name:
                description: Required check name to report on bot PRs.
                type: string
                default: Validate PR title

permissions:
    contents: read

jobs:
    title:
        name: Validate PR title
        # Bot PRs are reported by bot-prs; skipped also keeps an approved run green.
        if: github.repository_owner == 'valkey-io' && github.event_name == 'pull_request' && github.event.pull_request.user.login != 'github-actions[bot]'
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            pull-requests: read
        steps:
            - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  types: |
                      feat
                      fix
                      perf
                      revert
                      docs
                      ci
                      build
                      test
                      chore
                      refactor
                      style
                  # Dependabot titles vary by repo; its label already excludes it.
                  ignoreLabels: |
                      dependencies

    bot-prs:
        name: Report title check for bot PRs
        if: github.repository_owner == 'valkey-io' && github.event_name == 'workflow_run'
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            pull-requests: read
            statuses: write
        steps:
            - env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  CHECK_NAME: ${{ inputs.check-name || 'Validate PR title' }}
              run: |
                  set -euo pipefail
                  # ORT attribution PRs keep a fixed title, so it isn't checked.
                  gh pr list --author app/github-actions --state open --limit 1000 \
                      --json headRefOid --jq '.[].headRefOid' |
                      while read -r sha; do
                          gh api "repos/$GH_REPO/statuses/$sha" -f state=success \
                              -f context="$CHECK_NAME" -f description="Bot PR, title not checked" >/dev/null
                          echo "Reported $CHECK_NAME on $sha"
                      done
