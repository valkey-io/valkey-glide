name: lint-yaml

permissions:
    contents: read

on:
    push:
        branches:
            - main
            - release-*
        paths:
            - ".github/**/*.yml"
            - ".github/**/*.yaml"
    pull_request:
        paths:
            - ".github/**/*.yml"
            - ".github/**/*.yaml"
    workflow_dispatch:

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Install dependencies
              run: npm ci

            - name: Run Prettier on YAML files
              run: |
                  npx prettier --check .github/

            - name: Install PyYAML
              run: pip install --quiet PyYAML==6.0.3

            - name: Validate dependabot cooldown
              run: |
                  python3 - <<'EOF'
                  import yaml, sys
                  with open(".github/dependabot.yml") as f:
                      config = yaml.safe_load(f)
                  missing = [
                      entry.get("directory", "unknown")
                      for entry in config.get("updates", [])
                      if entry.get("cooldown", {}).get("default-days") != 7
                  ]
                  if missing:
                      print("ERROR: Entries not equal to 7:", missing)
                      sys.exit(1)
                  print(f"OK: all {len(config.get('updates', []))} entries have cooldown.default-days == 7")
                  EOF

            - name: Validate npmMinimalAgeGate
              run: |
                  python3 - <<'EOF'
                  import yaml, sys, re
                  errors = []
                  for path in [
                      "node/pm-and-types-tests/depend-on-glide-package/.yarnrc.yml",
                      "node/pm-and-types-tests/depend-on-glide-dependent/.yarnrc.yml",
                  ]:
                      with open(path) as f:
                          config = yaml.safe_load(f)
                      gate = config.get("npmMinimalAgeGate")
                      # Accept values like "7d", "10d", 7d (without quotes) where N >= 7
                      match = re.fullmatch(r'(\d+)d', str(gate) if gate is not None else '')
                      if not match or int(match.group(1)) < 7:
                          errors.append(f"{path}: npmMinimalAgeGate = {gate!r} (expected e.g. \"7d\", got invalid or too-low value)")
                  if errors:
                      for e in errors:
                          print("ERROR:", e)
                      sys.exit(1)
                  print("OK: all .yarnrc.yml files have a valid npmMinimalAgeGate")
                  EOF
