name: lint-yaml

permissions:
    contents: read

on:
    push:
        branches:
            - main
            - release-*
        paths:
            - ".github/**/*.yml"
            - ".github/**/*.yaml"
    pull_request:
        paths:
            - ".github/**/*.yml"
            - ".github/**/*.yaml"
    workflow_dispatch:

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Run Prettier on YAML files
              run: |
                  npx prettier --check .github/

            - name: Install PyYAML
              run: pip install --quiet PyYAML==6.0.3

            - name: Validate dependabot cooldown
              run: |
                  python3 - <<'EOF'
                  import yaml, sys
                  with open(".github/dependabot.yml") as f:
                      config = yaml.safe_load(f)
                  missing = [
                      entry.get("directory", "unknown")
                      for entry in config.get("updates", [])
                      if entry.get("cooldown", {}).get("default-days") != 7
                  ]
                  if missing:
                      print("ERROR: Entries not equal to 7:", missing)
                      sys.exit(1)
                  print(f"OK: all {len(config['updates'])} entries have cooldown.default-days == 7")
                  EOF
