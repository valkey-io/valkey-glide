name: Semgrep

permissions:
    contents: read

on:
    workflow_call:
    # Scan changed files in PRs (diff-aware scanning):
    pull_request: {}
    # Scan on-demand through GitHub Actions interface:
    workflow_dispatch:
        inputs:
            branch:
                description: "The branch to run against the semgrep tool"
                required: true
    push:
        branches:
            - main
            - release-*
            - v*
    # Schedule the CI job (this method uses cron syntax):
    schedule:
        - cron: "0 8 * * *" # Sets Semgrep to scan every day at 08:00 UTC.

jobs:
    changes:
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
        outputs:
            code: ${{ steps.filter.outputs.code }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              id: filter
              with:
                  filters: .github/filters.yaml
                  predicate-quantifier: some-with-excludes

    semgrep:
        # User definable name of this GitHub Actions job.
        name: semgrep/ci
        needs: changes
        # If you are self-hosting, change the following `runs-on` value:
        runs-on: ubuntu-24.04

        container:
            # A Docker image with Semgrep installed. Do not change this.
            image: semgrep/semgrep

        # Skip any PR created by dependabot to avoid permission issues; skip doc-only PRs.
        if: >
            !cancelled() && github.actor != 'dependabot[bot]' && github.repository_owner == 'valkey-io' &&
                (github.event_name != 'pull_request' || needs.changes.outputs.code != 'false')

        steps:
            # Fetch project source with GitHub Actions Checkout.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # Run the "semgrep ci" command on the command line of the docker image.
            - run: semgrep ci --config auto --no-suppress-errors --exclude-rule generic.secrets.security.detected-private-key.detected-private-key
