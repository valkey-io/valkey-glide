name: Semgrep Security Scan

permissions:
    contents: read

on:
    workflow_call:
        inputs:
            config:
                description: "Semgrep config to use"
                type: string
                default: "auto"
            exclude-rules:
                description: "Comma-separated list of rule IDs to exclude"
                type: string
                default: "generic.secrets.security.detected-private-key.detected-private-key"
    pull_request: {}
    workflow_dispatch:
        inputs:
            branch:
                description: "The branch to run against the semgrep tool"
                required: true
            config:
                description: "Semgrep config to use"
                type: string
                default: "auto"
            exclude-rules:
                description: "Comma-separated list of rule IDs to exclude"
                type: string
                default: "generic.secrets.security.detected-private-key.detected-private-key"
    push:
        branches:
            - main
            - release-*
            - v*
    schedule:
        - cron: "0 8 * * *" # Runs Semgrep scan daily at 08:00 UTC

jobs:
    semgrep:
        name: semgrep/ci
        runs-on: ubuntu-latest

        container:
            image: semgrep/semgrep:1.45.0 # Pinned version

        # Skip any PR created by dependabot to avoid permission issues
        if: (github.actor != 'dependabot[bot]' && github.repository_owner == 'valkey-io')

        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  submodules: recursive

            - name: Run Semgrep
              env:
                  SEMGREP_CONFIG: ${{ inputs.config || 'auto' }}
                  EXCLUDE_RULES: ${{ inputs.exclude-rules || 'generic.secrets.security.detected-private-key.detected-private-key' }}
              run: |
                  EXCLUDE_ARGS=""
                  for rule in $(echo "$EXCLUDE_RULES" | tr ',' ' '); do
                    EXCLUDE_ARGS="$EXCLUDE_ARGS --exclude-rule $rule"
                  done
                  echo "Running: semgrep ci --config $SEMGREP_CONFIG --no-suppress-errors $EXCLUDE_ARGS"
                  semgrep ci --config "$SEMGREP_CONFIG" --no-suppress-errors $EXCLUDE_ARGS
