name: glide-rdma CI

permissions:
    contents: read

on:
    push:
        branches:
            - main
            - release-*
            - v*
        paths:
            - glide-rdma/**

            # Rust dependencies
            - glide-logger/**
            - deny.toml

            # GitHub workflows
            - .github/workflows/glide-rdma.yml
            - .github/actions/install-libfabric/action.yml
            - .github/actions/install-protoc/action.yml
            - .github/actions/install-rust/action.yml
            - .github/actions/lint-rust/action.yml

            # Exclusions
            - "!**/*.md"
    pull_request:
        paths:
            - glide-rdma/**

            # Rust dependencies
            - glide-logger/**
            - deny.toml

            # GitHub workflows
            - .github/workflows/glide-rdma.yml
            - .github/actions/install-libfabric/action.yml
            - .github/actions/install-protoc/action.yml
            - .github/actions/install-rust/action.yml
            - .github/actions/lint-rust/action.yml

            # Exclusions
            - "!**/*.md"
    workflow_dispatch:
        inputs:
            keep_hosts:
                description: "Leave the EFA pair up on failure for diagnosis (test-efa job)"
                type: boolean
                default: false
    workflow_call:
    # TODO #7409: Run this workflow from fmt-all.yml and full-matrix-tests.yml.

concurrency:
    group: glide-rdma-${{ github.head_ref || github.ref }}-${{ github.workflow }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always

jobs:
    tests:
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                # TODO #7410: Use the shared test matrix, excluding Windows.
                os: [ubuntu-24.04, macos-latest]

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install Rust toolchain
              uses: ./.github/actions/install-rust
              with:
                  target: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || 'x86_64-unknown-linux-gnu' }}

            - name: Install libfabric
              uses: ./.github/actions/install-libfabric

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: glide-rdma/target
                  key: ${{ runner.os }}-glide-rdma-${{ hashFiles('glide-rdma/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-glide-rdma-

            - name: Run glide-rdma tests
              working-directory: ./glide-rdma
              run: cargo test --locked

            - name: Run glide-rdma tests with libfabric
              working-directory: ./glide-rdma
              run: |
                  cargo test --locked --features tcp-dev
                  # The release shape: `libfabric` alone carries no tcp provider.
                  cargo test --locked --features libfabric --test test_libfabric_missing

    lint:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: ./.github/actions/lint-rust
              with:
                  cargo-toml-folder: glide-rdma
                  github-token: ${{ secrets.GITHUB_TOKEN }}
              name: lint glide-rdma

            # lint-rust runs clippy with all features, including `regenerate-bindings`.
            # This runs bindgen, which requires libclang.
            - name: Install libclang for bindgen
              run: sudo apt-get update && sudo apt-get install -y libclang-dev

            - uses: ./.github/actions/lint-rust
              with:
                  cargo-toml-folder: glide-rdma/glide-libfabric-sys
                  github-token: ${{ secrets.GITHUB_TOKEN }}
              name: lint glide-libfabric-sys

    # --- EFA hardware test (manual dispatch only) ---------------------------
    # build-rdma-wheels builds both Python clients with RDMA in an
    # amazonlinux:2023 arm64 container and uploads the wheels as a run artifact.
    # test-efa downloads them, re-stages to S3, brings up a real c8gn.16xlarge
    # EFA pair, runs the host test steps, and tears it down. Both are gated to
    # workflow_dispatch until proven; the scripts and templates live under
    # glide-rdma/ci/efa/. One-time setup (Admin) and the repo secret/variables
    # are documented in glide-rdma/ci/efa/README.md.
    build-rdma-wheels:
        name: Build RDMA Python wheels (arm64 / amazonlinux:2023)
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-24.04-arm
        container:
            image: amazonlinux:2023
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - name: Install toolchain dependencies
              run: |
                  dnf -y -q groupinstall "Development Tools"
                  dnf -y -q install git python3-pip openssl-devel pkgconf-pkg-config cmake unzip python3-devel
                  dnf clean all

            - name: Install Rust (stable)
              # rustup writes ~/.cargo; the Build step prepends /root/.cargo/bin to PATH.
              run: curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable

            - name: Install protoc 3.20.3
              run: |
                  curl -fsSLo /tmp/protoc.zip \
                    https://github.com/protocolbuffers/protobuf/releases/download/v3.20.3/protoc-3.20.3-linux-aarch_64.zip
                  unzip -oq /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Cache Rust build artifacts
              uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd4c90 # v2.7.8
              with:
                  workspaces: ffi -> target

            - name: Build wheels
              # glide-libfabric-sys vendors its headers and ships checked-in bindings,
              # so the RDMA build needs no system libfabric or EFA installer here.
              env:
                  PATH: /root/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              run: |
                  PYTHONUNBUFFERED=1 python3 python/dev.py build \
                    --client all --mode release --rdma --wheel \
                    --glide-version "0.0.0+${{ github.sha }}"

            - name: Collect wheels
              run: |
                  mkdir -p /tmp/rdma-wheels
                  find python -name '*.whl' -print0 | xargs -0 -I{} cp {} /tmp/rdma-wheels/
                  ls -la /tmp/rdma-wheels

            # The test host has no GitHub artifact access, so test-efa re-stages
            # these to S3. The artifact is the build->test transfer, nothing else.
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: rdma-wheels-${{ github.run_id }}
                  path: /tmp/rdma-wheels/*.whl
                  if-no-files-found: error
                  retention-days: 1

    test-efa:
        name: EFA hardware test (c8gn.16xlarge pair, us-east-1)
        if: github.event_name == 'workflow_dispatch'
        needs: build-rdma-wheels
        runs-on: ubuntu-24.04
        # AWS_ACTIONS requires a maintainer approval click per run, acting as the
        # gate for real AWS resource usage (~$3/run, ~20 min).
        environment: AWS_ACTIONS
        permissions:
            id-token: write
            contents: read
        timeout-minutes: 60
        concurrency:
            # One EFA pair at a time; a second dispatch queues rather than races.
            group: rdma-efa-pair
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Download wheels from the build job
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: rdma-wheels-${{ github.run_id }}
                  path: wheels

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
              with:
                  role-to-assume: ${{ secrets.AWS_RDMA_ROLE_ARN }}
                  aws-region: us-east-1
                  # Keep ≥ the presign --expires-in below plus the job runtime.
                  role-duration-seconds: 7200

            - name: Stage wheels to S3 and presign
              run: |
                  tar -C wheels -cf /tmp/wheels.tar .
                  aws s3 cp /tmp/wheels.tar \
                    "s3://${{ vars.RDMA_WHEEL_BUCKET }}/rdma-ci/${{ github.run_id }}/wheels.tar"
                  # --expires-in must stay ≤ the remaining role-session seconds, or
                  # the URL 403s on the host even though the clock has not elapsed.
                  WHEEL_URL=$(aws s3 presign \
                    "s3://${{ vars.RDMA_WHEEL_BUCKET }}/rdma-ci/${{ github.run_id }}/wheels.tar" \
                    --expires-in 3600)
                  echo "WHEEL_URL=$WHEEL_URL" >> "$GITHUB_ENV"

            - name: Bring up EFA pair
              working-directory: glide-rdma/ci/efa
              env:
                  RDMA_STACK: rdma-ci-${{ github.run_id }}
                  RDMA_VPC_ID: ${{ vars.RDMA_VPC_ID }}
                  RDMA_SUBNETS: ${{ vars.RDMA_SUBNETS }}
                  RDMA_OWNER: ci
              run: bin/rdma-pair.sh apply

            - name: Step 0 — check EFA on both hosts
              working-directory: glide-rdma/ci/efa
              env:
                  RDMA_STACK: rdma-ci-${{ github.run_id }}
              run: |
                  bin/run-on.sh server host/00-check-efa.sh
                  bin/run-on.sh client host/00-check-efa.sh

            - name: Steps 1–3 — EFA pingpong
              working-directory: glide-rdma/ci/efa
              env:
                  RDMA_STACK: rdma-ci-${{ github.run_id }}
              run: |
                  bin/run-on.sh server host/10-pingpong-listen.sh
                  bin/run-on.sh client host/11-pingpong-connect.sh
                  bin/run-on.sh server host/12-pingpong-result.sh

            - name: Steps 5–6 — build and start Valkey server
              working-directory: glide-rdma/ci/efa
              env:
                  RDMA_STACK: rdma-ci-${{ github.run_id }}
              run: |
                  bin/run-on.sh server host/20-server-build.sh
                  bin/run-on.sh server host/21-server-start.sh

            - name: Step 7 — install GLIDE clients (prebuilt wheels)
              working-directory: glide-rdma/ci/efa
              env:
                  RDMA_STACK: rdma-ci-${{ github.run_id }}
              run: |
                  bin/run-on.sh client host/30-client-setup.sh \
                    GLIDE_WHEELS="$WHEEL_URL" \
                    GLIDE_SOURCE="${{ github.sha }}"

            - name: Step 8 — run RDMA tests
              working-directory: glide-rdma/ci/efa
              env:
                  RDMA_STACK: rdma-ci-${{ github.run_id }}
              run: bin/run-on.sh client host/31-client-rdma-tests.sh

            - name: Step 9 — large-object round trip
              working-directory: glide-rdma/ci/efa
              env:
                  RDMA_STACK: rdma-ci-${{ github.run_id }}
              run: bin/run-on.sh client host/32-client-large-object.sh

            - name: Tear down EFA pair
              if: always()
              working-directory: glide-rdma/ci/efa
              env:
                  RDMA_STACK: rdma-ci-${{ github.run_id }}
              run: |
                  # keep_hosts defaults to false; down runs unless the operator
                  # dispatched with keep_hosts=true and the job failed.
                  if [ "${{ github.event.inputs.keep_hosts }}" = "true" ] && [ "${{ job.status }}" != "success" ]; then
                    echo "keep_hosts=true and job failed; leaving stack rdma-ci-${{ github.run_id }} up for diagnosis"
                  else
                    bin/rdma-pair.sh down
                  fi
