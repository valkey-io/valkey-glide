name: glide-rdma CI

permissions:
    contents: read

on:
    push:
        branches:
            - main
            - release-*
            - v*
        paths:
            - glide-rdma/**

            # Rust dependencies
            - deny.toml

            # GitHub workflows
            - .github/workflows/glide-rdma.yml
            - .github/actions/install-libfabric/action.yml
            - .github/actions/install-protoc/action.yml
            - .github/actions/install-rust/action.yml
            - .github/workflows/lint-rust/action.yml
            - "!**/*.md"
            - "!**/THIRD_PARTY_LICENSES*"
    pull_request:
        paths:
            - glide-rdma/**

            # Rust dependencies
            - deny.toml

            # GitHub workflows
            - .github/workflows/glide-rdma.yml
            - .github/actions/install-libfabric/action.yml
            - .github/actions/install-protoc/action.yml
            - .github/actions/install-rust/action.yml
            - .github/workflows/lint-rust/action.yml
            - "!**/*.md"
            - "!**/THIRD_PARTY_LICENSES*"
    workflow_dispatch:
    # TODO #7409: Add `workflow_call:` so fmt-all.yml, full-matrix-tests.yml, and rust-cd.yml can run this workflow.

concurrency:
    group: glide-rdma-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always

jobs:
    tests:
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                # TODO #7410: Use the shared test matrix, excluding Windows.
                os: [ubuntu-latest, macos-latest]

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install Rust toolchain
              uses: ./.github/actions/install-rust
              with:
                  target: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || 'x86_64-unknown-linux-gnu' }}

            - name: Install libfabric
              uses: ./.github/actions/install-libfabric

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: glide-rdma/target
                  key: ${{ runner.os }}-glide-rdma-${{ hashFiles('glide-rdma/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-glide-rdma-

            - name: Run tests
              working-directory: ./glide-rdma
              run: cargo test

            - name: Run tests with libfabric
              working-directory: ./glide-rdma
              run: cargo test --features libfabric

    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: ./.github/workflows/lint-rust
              with:
                  cargo-toml-folder: glide-rdma
                  github-token: ${{ secrets.GITHUB_TOKEN }}
              name: lint glide-rdma
