# Nightly full-matrix tests for the glide-core-engine (vendored redis-rs fork) crate.
# Thin wrapper around glide-core-engine.yml that isolates scheduling so per-language
# full-matrix runs can be staggered and failures do not cascade across
# languages. Flaky-test isolation work: see #4629.
name: FMT glide-core-engine

permissions:
    contents: read
    actions: write

on:
    # Nightly at 05:30 UTC (10:30 PM PDT).
    schedule:
        - cron: "30 5 * * *"
    workflow_dispatch:
        inputs:
            use-self-hosted-linux:
                description: "Use self-hosted runners for Linux x64"
                type: boolean
                default: false

concurrency:
    group: fmt-glide-core-engine-${{ github.ref }}
    cancel-in-progress: true

jobs:
    run-fmt-glide-core-engine:
        if: github.repository_owner == 'valkey-io'
        uses: ./.github/workflows/glide-core-engine.yml
        with:
            use-self-hosted-linux: ${{ inputs.use-self-hosted-linux || false }}
        name: FMT - glide-core-engine
