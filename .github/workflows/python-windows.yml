name: Python - Windows wheel builds

on:
    pull_request:
        paths:
            - .github/actions/install-protoc/action.yml
            - .github/actions/install-rust/action.yml
            - .github/actions/install-shared-dependencies/action.yml
            - .github/workflows/python-windows.yml
            - ffi/**
            - glide-core/**
            - glide-logger/**
            - python/**
    workflow_dispatch:

concurrency:
    group: python-windows-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

# CI artifacts only. Publishing requires Windows server integration coverage first.
env:
    BUILD_VERSION: "0.1.0"

jobs:
    load-windows-matrix:
        runs-on: ubuntu-latest
        outputs:
            WINDOWS_MATRIX: ${{ steps.matrix.outputs.WINDOWS_MATRIX }}
        steps:
            - name: Set Windows matrix
              id: matrix
              shell: pwsh
              run: |
                  if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
                      $amd64Versions = @("3.14")
                      $arm64Versions = @("3.14")
                  } else {
                      $amd64Versions = @("3.9", "3.10", "3.11", "3.12", "3.13", "3.14")
                      $arm64Versions = @("3.11", "3.12", "3.13", "3.14")
                  }
                  $matrix = @(
                      foreach ($version in $amd64Versions) {
                          @{
                              RUNNER = "windows-latest"
                              ARCH = "AMD64"
                              PYTHON_ARCH = "x64"
                              TARGET = "x86_64-pc-windows-msvc"
                              WHEEL_TAG = "win_amd64"
                              PYTHON_VERSION = $version
                          }
                      }
                      foreach ($version in $arm64Versions) {
                          @{
                              RUNNER = "windows-11-arm"
                              ARCH = "ARM64"
                              PYTHON_ARCH = "arm64"
                              TARGET = "aarch64-pc-windows-msvc"
                              WHEEL_TAG = "win_arm64"
                              PYTHON_VERSION = $version
                          }
                      }
                  )
                  "WINDOWS_MATRIX=$($matrix | ConvertTo-Json -Compress)" >> $env:GITHUB_OUTPUT

    build-windows-wheels:
        needs: load-windows-matrix
        name: Build Python ${{ matrix.build.PYTHON_VERSION }} wheels for Windows ${{ matrix.build.ARCH }}
        runs-on: ${{ matrix.build.RUNNER }}
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                build: ${{ fromJson(needs.load-windows-matrix.outputs.WINDOWS_MATRIX) }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: "true"
                  persist-credentials: false

            - name: Install native build dependencies
              uses: ./.github/actions/install-shared-dependencies
              with:
                  os: windows
                  target: ${{ matrix.build.TARGET }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up target Python ${{ matrix.build.PYTHON_VERSION }}
              id: target_python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: ${{ matrix.build.PYTHON_VERSION }}
                  architecture: ${{ matrix.build.PYTHON_ARCH }}

            - name: Set up Python 3.14 build environment
              id: build_python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.14"
                  architecture: ${{ matrix.build.PYTHON_ARCH }}

            - name: Install Python build dependencies
              shell: pwsh
              run: |
                  & "$env:TARGET_PYTHON" -m pip install --upgrade pip build mypy-protobuf
                  & "$env:BUILD_PYTHON" -m pip install --upgrade pip "cibuildwheel>=4.0.0"
              env:
                  BUILD_PYTHON: ${{ steps.build_python.outputs.python-path }}
                  TARGET_PYTHON: ${{ steps.target_python.outputs.python-path }}

            - name: Generate protobuf files
              shell: pwsh
              run: |
                  $protoSource = (Resolve-Path "glide-core\src\protobuf").Path
                  $protoDestination = (Resolve-Path "python\glide-shared\glide_shared").Path
                  $mypyPlugin = & "$env:TARGET_PYTHON" -c "import os, sysconfig; print(os.path.join(sysconfig.get_path('scripts'), 'protoc-gen-mypy.exe'))"
                  if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $mypyPlugin -PathType Leaf)) {
                      throw "Could not locate protoc-gen-mypy for the target Python"
                  }
                  $protoFiles = Get-ChildItem "$protoSource\*.proto" | ForEach-Object { $_.FullName }

                  & protoc "--plugin=protoc-gen-mypy=$mypyPlugin" "--proto_path=protobuf=$protoSource" "--python_out=$protoDestination" "--mypy_out=$protoDestination" @protoFiles
                  if ($LASTEXITCODE -ne 0) {
                      throw "Failed to generate Python protobuf files"
                  }
              env:
                  TARGET_PYTHON: ${{ steps.target_python.outputs.python-path }}

            - name: Prepare Python packages
              shell: pwsh
              run: |
                  foreach ($package in @("glide-async", "glide-sync", "glide-shared")) {
                      $pyproject = "python\$package\pyproject.toml"
                      $content = Get-Content $pyproject -Raw
                      $versionDeclaration = "version = `"$env:BUILD_VERSION`""
                      $content = $content.Replace('dynamic = ["version"]', $versionDeclaration)
                      if (-not $content.Contains($versionDeclaration)) {
                          throw "Failed to set the build version in $pyproject"
                      }
                      [IO.File]::WriteAllText((Resolve-Path $pyproject), $content)
                  }

                  Get-Content "python\.gitignore" |
                      Where-Object { $_ -notmatch "\*_pb2\.(py|pyi)" } |
                      Set-Content "python\glide-sync\.gitignore"
                  Copy-Item "python\glide-sync\.gitignore" "python\glide-async\.gitignore"
                  Copy-Item "python\README.md" "python\glide-sync\README.md"
                  Copy-Item "python\README.md" "python\glide-async\README.md"
                  Copy-Item "python\glide-shared\glide_shared" "python\glide-async\python" -Recurse -Force

            - name: Test FFI ABI
              if: matrix.build.PYTHON_VERSION == '3.14'
              run: cargo test --manifest-path ffi\Cargo.toml --test test_command_response_layout --test test_statistics
              env:
                  GLIDE_NAME: GlidePySync
                  GLIDE_VERSION: ${{ env.BUILD_VERSION }}

            - name: Build native dependencies for the async client
              shell: pwsh
              run: |
                  cargo build --manifest-path ffi\Cargo.toml --release
                  if ($LASTEXITCODE -ne 0) {
                      throw "Failed to build glide-ffi"
                  }
                  Copy-Item "ffi\target\release\glide_ffi.dll" "python\glide-async\python\glide_shared"

                  $sharedWheels = Join-Path $env:RUNNER_TEMP "glide-shared-wheels"
                  & "$env:TARGET_PYTHON" -m build --wheel --outdir $sharedWheels "python\glide-shared"
                  if ($LASTEXITCODE -ne 0) {
                      throw "Failed to build glide-shared"
                  }
                  $sharedWheel = Get-ChildItem "$sharedWheels\*.whl"
                  & "$env:TARGET_PYTHON" -c "import sys, zipfile; wheel, dest = sys.argv[1:]; archive = zipfile.ZipFile(wheel); matches = [name for name in archive.namelist() if name.startswith('glide_shared/_fast_response') and name.endswith('.pyd')]; assert matches, 'Shared wheel is missing _fast_response*.pyd'; [archive.extract(name, dest) for name in matches]" $sharedWheel.FullName "python\glide-async\python"
                  if ($LASTEXITCODE -ne 0) {
                      throw "Failed to extract the shared native extension"
                  }
              env:
                  GLIDE_NAME: GlidePy
                  GLIDE_VERSION: ${{ env.BUILD_VERSION }}
                  TARGET_PYTHON: ${{ steps.target_python.outputs.python-path }}

            - name: Build Python Async client wheel
              shell: pwsh
              run: '& "$env:TARGET_PYTHON" -m build --wheel --outdir python\glide-async\wheels python\glide-async'
              env:
                  GLIDE_NAME: GlidePy
                  GLIDE_VERSION: ${{ env.BUILD_VERSION }}
                  TARGET_PYTHON: ${{ steps.target_python.outputs.python-path }}

            - name: Build Python Sync client wheel
              shell: pwsh
              run: |
                  $pythonTag = "cp$($env:PYTHON_VERSION.Replace('.', ''))"
                  $env:CIBW_BUILD = "$pythonTag-$env:WHEEL_TAG"
                  & "$env:BUILD_PYTHON" -m cibuildwheel python\glide-sync --output-dir python\glide-sync\wheels
              env:
                  BUILD_PYTHON: ${{ steps.build_python.outputs.python-path }}
                  CIBW_ARCHS_WINDOWS: ${{ matrix.build.ARCH }}
                  GLIDE_NAME: GlidePySync
                  GLIDE_VERSION: ${{ env.BUILD_VERSION }}
                  PYTHON_VERSION: ${{ matrix.build.PYTHON_VERSION }}
                  WHEEL_TAG: ${{ matrix.build.WHEEL_TAG }}

            - name: Smoke test wheels
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $PSNativeCommandUseErrorActionPreference = $true

                  $pythonTag = "cp$($env:PYTHON_VERSION.Replace('.', ''))"
                  $asyncWheel = Get-ChildItem "python\glide-async\wheels\*$pythonTag*$env:WHEEL_TAG.whl"
                  $syncWheel = Get-ChildItem "python\glide-sync\wheels\*$pythonTag*$env:WHEEL_TAG.whl"
                  if ($asyncWheel.Count -ne 1 -or $syncWheel.Count -ne 1) {
                      throw "Expected one async and one sync wheel for $pythonTag-$env:WHEEL_TAG"
                  }

                  & "$env:TARGET_PYTHON" -m venv "$env:RUNNER_TEMP\smoke-async"
                  & "$env:RUNNER_TEMP\smoke-async\Scripts\python.exe" -m pip install $asyncWheel.FullName
                  & "$env:RUNNER_TEMP\smoke-async\Scripts\python.exe" "python\tests\windows_wheel_smoke.py" --client async

                  & "$env:TARGET_PYTHON" -m venv "$env:RUNNER_TEMP\smoke-sync"
                  & "$env:RUNNER_TEMP\smoke-sync\Scripts\python.exe" -m pip install $syncWheel.FullName
                  & "$env:RUNNER_TEMP\smoke-sync\Scripts\python.exe" "python\tests\windows_wheel_smoke.py" --client sync
              env:
                  PYTHON_VERSION: ${{ matrix.build.PYTHON_VERSION }}
                  TARGET_PYTHON: ${{ steps.target_python.outputs.python-path }}
                  WHEEL_TAG: ${{ matrix.build.WHEEL_TAG }}

            - name: Run Windows regression tests
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $PSNativeCommandUseErrorActionPreference = $true

                  & "$env:RUNNER_TEMP\smoke-async\Scripts\python.exe" -m pip install "pytest<9.1"
                  & "$env:RUNNER_TEMP\smoke-async\Scripts\python.exe" -m pytest --noconftest -o "addopts=" python\tests\test_windows_wheels.py python\tests\async_tests\test_pipe_reader.py

            - name: Upload Python Async client wheel
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: windows-ci-${{ matrix.build.TARGET }}-py${{ matrix.build.PYTHON_VERSION }}-async
                  path: python/glide-async/wheels
                  if-no-files-found: error

            - name: Upload Python Sync client wheel
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: windows-ci-${{ matrix.build.TARGET }}-py${{ matrix.build.PYTHON_VERSION }}-sync
                  path: python/glide-sync/wheels
                  if-no-files-found: error
