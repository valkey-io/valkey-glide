[package]
name = "glide-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Valkey GLIDE Maintainers"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

# GLIDE dependencies
glide-logger = { path = "../glide-logger", version = "0.1" }
glide-telemetry = { path = "../glide-telemetry", version = "0.1" }

# TODO #6905: Update once renamed.
redis = { path = "./redis-rs/redis", features = ["aio", "keep-alive", "tokio-comp", "tokio-rustls-comp", "connection-manager", "cluster", "cluster-async"] }

# External dependencies
async-trait = { version = "0.1" }
aws-config = "1"
aws-credential-types = "1"
aws-sigv4 = "1"
aws-smithy-types = "<1.7"
bytes = "1"
dashmap = "~6.2.1"
directories = { version = "6", optional = true }
futures = "^0.3"
futures-intrusive = "0.5"
http = "1"
integer-encoding = { version = "4", optional = true }
libc = "0.2.186"
lz4 = { version = "1.28" }
nanoid = "0.4"
num_cpus = { version = "^1", optional = true }
once_cell = "1"
protobuf = { version = "3", features = ["bytes", "with-bytes"], optional = true }
rand = { version = "0.8" }
regex = "=1.13.1"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
rustls-pki-types = "1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
sha2 = "0.11"
strum = "0.28"
strum_macros = "0.28"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "time"] }
tokio-retry2 = { version = "0.6", features = ["jitter"] }
tokio-util = { version = "^0.7", features = ["rt"], optional = true }
urlencoding = "2"
uuid = { version = "1", features = ["v4", "fast-rng"] }
versions = "7"
zstd = { version = "0.14" }

[features]
proto = ["protobuf"]
socket-layer = [
    "proto",
    "directories",
    "integer-encoding",
    "num_cpus",
    "tokio-util",
]
standalone_heartbeat = []
iam_tests = []
mock-pubsub = []
test-util = []

[dev-dependencies]
rsevents = "0.3.1"
socket2 = "0.6"
tempfile = "3.3.0"
rstest = "^0.27"
serial_test = "4"
criterion = { version = "^0.8", features = ["html_reports", "async_tokio"] }
which = "8"
ctor = "1.0"
redis = { path = "./redis-rs/redis", features = ["tls-rustls-insecure"] }
rustls = { version = "0.23", features = ["aws-lc-rs"]}
gungraun = "0.19"
tokio = { version = "1", features = ["rt-multi-thread"] }
glide-core = { path = ".", features = [
    "socket-layer",
    "test-util",
] } # always enable this feature in tests.

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(standalone_heartbeat)', 'cfg(feature, values("iam_tests", "test-util"))'] }

[lints.clippy]
# Prevent blocking the async runtime
await_holding_lock = "deny"
# Additional async safety lints
mutex_atomic = "warn"

[build-dependencies]
protobuf-codegen = "3"

[[bench]]
name = "rotating_buffer_benchmark"
harness = false

[[bench]]
name = "connections_benchmark"
harness = false

[[bench]]
name = "memory_benchmark"
harness = false

[[bench]]
name = "watchdog_register_bench"
harness = false
