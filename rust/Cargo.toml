[package]
name = "glide-rust"
version = "0.2.0"
rust-version = "1.94.1"
edition = "2024"
license = "Apache-2.0"
authors = ["Valkey GLIDE Maintainers"]
description = "Valkey GLIDE — native Rust client for Valkey and Redis OSS, built on glide-core."
repository = "https://github.com/valkey-io/valkey-glide"
homepage = "https://valkey.io/valkey-glide/"
readme = "README.md"
keywords = ["valkey", "redis", "glide", "client", "database"]
categories = ["database", "asynchronous"]
exclude = ["/tests"]

[lib]
name = "glide"
path = "src/lib.rs"

[dependencies]

# GLIDE dependencies
glide-logger = { path = "../glide-logger", version = "0.1" }

# TODO #6905: Update once renamed.
# TODO #6519: Add version once the dependency chain is published to crates.io.
glide-core = { path = "../glide-core" }
redis = {path = "../glide-core/redis-rs/redis", features = ["aio", "tokio-comp", "cluster", "cluster-async"] }

# External dependencies
async-trait = "0.1"
bytes = "1"
futures = "0.3"
num-bigint = "0.4"
ryu = "1"
sealed = "0.7"
sha1_smol = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
once_cell = "1"
url = "2"
regex = "1"
serde_json = "1"

[features]
default = ["sync"]
# Blocking client layer (mirrors Python glide-sync).
sync = []

# Lint hardening, mirroring glide-core's async-safety posture.
[lints.clippy]
# Never hold a (std/parking_lot) lock guard across an .await point.
await_holding_lock = "deny"
# Prefer atomics over a Mutex<bool>/Mutex<integer>.
mutex_atomic = "warn"
