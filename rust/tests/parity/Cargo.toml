# Dev tool for the command-table parity guard — never published (see `publish`).
# It lives alongside the guard (`mod.rs`) it serves: it is a `glide-rust`
# dev-dependency (the guard calls its parser in-process) and a standalone CLI for
# regenerating the committed redis-rs baseline:
#   cargo run --manifest-path tests/parity/Cargo.toml -- --input <table.rs> ...
# Files sit directly in this dir (next to types.rs / mod.rs), so lib/bin paths
# are spelled out rather than using the default src/ layout.
[package]
name = "parity-guard"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Parity guard test library for Valkey GLIDE Rust client"

[lib]
name = "parity_guard"
path = "lib.rs"

[[bin]]
name = "parity-guard"
path = "main.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
